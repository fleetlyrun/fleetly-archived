# release 轨道（交付流水线 docs/design/2026-09-17-delivery-pipeline.md §2.2
# release 段 / P6「安装脚本 + 二进制签名与校验和」/ §2.5 供应链；T2.24 M1）。
#
# 触发：push tag v* + workflow_dispatch（输入已存在的 tag，供预演）。
# 制品链（deploy/README.md「release 契约」的落地）：
#   1. build matrix  linux amd64+arm64，CGO_ENABLED=0，-trimpath + 版本注入
#      （-X main.version=<tag>）→ fleetly_<tag>_linux_<arch>.tar.gz
#      （tar 包根下 fleetlyd+fleetly；安装脚本不打进 tar——独立制品，契约
#      保持 install.sh 在 release 根）。
#   2. checksums.txt 全部制品 sha256（两个 tar + 三个安装脚本）。
#   3. SBOM：syft（anchore/sbom-action@v0.24.2）产 spdx-json——tar.gz 不是
#      syft 支持的源 scheme，按 arch 解包后扫目录（Go 二进制经 go-module
#      cataloger 带出依赖清单），证据等价。
#   4. cosign keyless 签名（id-token: write，GitHub OIDC）：
#      sign-blob --bundle → checksums.txt.sig（Sigstore bundle JSON，v3
#      唯一签名产物形态）+ 提取 checksums.txt.cert。双验证门：
#        a) --bundle 轨（gate A）：--bundle checksums.txt.sig + keyless
#           identity 约束——install.sh 现行命令面的逐字复验；
#        b) --certificate 轨（gate B）：detached signature + 从 bundle
#           提取的证书——同一签名材料的补充验证形态，证明产物在两种
#           cosign 验证轨道下均成立。
#      4b.（S14/H15）openssl 兼容轨签名：repo secret FLEETLY_RELEASE_KEY
#      （PEM 私钥，RSA-2048）→ openssl dgst -sha256 -sign →
#      checksums.txt.sig.pem，与 cosign bundle 并行发布（双轨并存——干净
#      VPS 无 cosign 常态，install.sh/upgrade.sh 内嵌公钥验此产物）。secret
#      缺席时跳过（过渡期，warn 不 fail）；一旦配置，embedded-pubkey gate
#      强制校验脚本内嵌公钥/指纹与 secret 配对。
#   5. ghcr 镜像：deploy/Dockerfile.fleetlyd（多阶段，golang 构建层 +
#      console 构建层〔产物烤入 /opt/fleetly/console，2026-09-29 起〕+
#      alpine 运行层，入口 fleetlyd）→ ghcr.io/fleetlyrun/fleetlyd:<tag>
#      （linux/amd64；arm64 运行形态走 tarball/安装器，见遗留）+ cosign
#      sign 镜像（keyless，按 digest 签）。
#   6. GitHub Release：gh release create 附全部制品 + notes 模板（引擎支持
#      矩阵 + 安装一条命令 + 验签指引）。
#   7. arm64 原生冒烟（T0-V2.3）：ubuntu-24.04-arm 原生跑 build + 单测冒烟
#      ——补 build matrix「arm64 只验产物存在」的运行验证缺口（详见
#      smoke-arm64 job 注释与 runner 口径说明）。
#
# 首发实跑归 T2.26（打 tag 验收）；本文件 T2.24 落地，本地仅做 YAML 解析与
# 命令面自查。
#
# F1（S20 交付/CI 修正）：本 workflow 持 id-token: write，全部 uses 必须
# 钉 commit SHA（注释版本号便于人读；升级 action = 同时改 SHA 与版本注释）。
# SHA 于 2026-09-19 经 GitHub API /commits/<tag> 解析并经 tags 列表 /
# git ls-remote 交叉核验。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GHCR_IMAGE: ghcr.io/fleetlyrun/fleetlyd
  EXPECTED_SIGNER: ^https://github\.com/fleetlyrun/fleetly/
  EXPECTED_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # ─────────────────────────────────────────────── 1. 交叉编译 + 打包 ────
  build:
    name: build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          printf '%s' "$V" | grep -Eq '^v[0-9]+(\.[0-9]+){0,2}([-+][A-Za-z0-9.-]+)?$' ||
            { echo "::error::version '$V' is not a v-prefixed semver tag"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - name: cross build (CGO off, trimpath, version injected)
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          GOOS=linux GOARCH='${{ matrix.arch }}' CGO_ENABLED=0 \
            go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/out/fleetlyd" ./cmd/fleetlyd
          GOOS=linux GOARCH='${{ matrix.arch }}' CGO_ENABLED=0 \
            go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/out/fleetly" ./cmd/fleetly
      - name: version smoke (binary self-report)
        # amd64 可本机直跑自报版本；arm64 的运行验证由 smoke-arm64 job 在
        # ubuntu-24.04-arm 原生 runner 完成（T0-V2.3——此前以 QEMU 成本为由
        # 列遗留，现原生 runner 免费可得，不再欠账）。
        run: |
          test -s dist/out/fleetlyd && test -s dist/out/fleetly
          if [ '${{ matrix.arch }}' = 'amd64' ]; then
            [ "$(dist/out/fleetly version 2>/dev/null | awk '{print $2}')" = '${{ steps.ver.outputs.version }}' ]
          fi
      - name: pack tar.gz (archive root = fleetlyd+fleetly)
        run: |
          mkdir -p dist/pkg
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "dist/fleetly_${{ steps.ver.outputs.version }}_linux_${{ matrix.arch }}.tar.gz" \
            -C dist/out fleetlyd fleetly
          sha256sum "dist/fleetly_${{ steps.ver.outputs.version }}_linux_${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tar-linux-${{ matrix.arch }}
          path: dist/fleetly_*.tar.gz
          if-no-files-found: error

  # ───────────────────────────────────────────── 2. checksums + 安装脚本 ──
  checksums:
    name: checksums + installer scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-tar-linux-*
          merge-multiple: true
          path: dist
      - name: stage installer scripts (independent release assets, flat names)
        run: |
          sh -n deploy/install.sh && sh -n deploy/uninstall.sh && sh -n deploy/upgrade.sh
          cp deploy/install.sh deploy/uninstall.sh deploy/upgrade.sh dist/
      - name: generate checksums.txt (asset names = final release names)
        run: |
          cd dist
          sha256sum fleetly_*.tar.gz install.sh uninstall.sh upgrade.sh > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checksums
          path: |
            dist/checksums.txt
            dist/fleetly_*.tar.gz
            dist/install.sh
            dist/uninstall.sh
            dist/upgrade.sh
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────── 3. SBOM ──
  sbom:
    name: SBOM (syft spdx-json)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-tar-linux-*
          merge-multiple: true
          path: dist
      - name: extract per-arch tarballs (syft scans dirs, not raw tars)
        run: |
          cd dist
          for tarball in fleetly_*.tar.gz; do
            arch=${tarball##*linux_}; arch=${arch%.tar.gz}
            mkdir -p "sbom-src/$arch"
            tar -xzf "$tarball" -C "sbom-src/$arch"
          done
          ls -la sbom-src/*
      - name: sbom linux/amd64
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact: dist/sbom-src/amd64
          format: spdx-json
          output-file: dist/fleetly_${{ steps.ver.outputs.version }}_linux_amd64.spdx.json
      - name: sbom linux/arm64
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact: dist/sbom-src/arm64
          format: spdx-json
          output-file: dist/fleetly_${{ steps.ver.outputs.version }}_linux_arm64.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: dist/*.spdx.json
          if-no-files-found: error

  # ───────────────────────────────────────────── 4. cosign keyless 签名 ──
  sign:
    name: sign checksums (cosign keyless + openssl track)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: checksums
    steps:
      # embedded-pubkey gate（下方 openssl 轨步骤）需要读 deploy/install.sh
      # 与 deploy/upgrade.sh 的内嵌公钥块。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-checksums
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign checksums.txt (keyless; GitHub OIDC)
        run: |
          cd dist
          # cosign v3 keyless 的唯一签名产物形态是 Sigstore bundle（已本地
          # 实证：v3 无 --output-signature/--output-certificate，stdout 为
          # 空）。checksums.txt.sig = bundle JSON（install.sh 契约文件名；
          # 内嵌签名 + 证书 + Rekor 条目，自足可验）。
          cosign sign-blob --yes \
            --bundle checksums.txt.sig \
            checksums.txt
          # 从 bundle 提取签名证书（install.sh --certificate 形态用）。cosign v3
          # 实测 bundle 结构：verificationMaterial.certificate.rawBytes = 裸
          # base64(DER)——封装为规范 PEM（64 列折行），verify 与分发都要 PEM。
          jq -r '.verificationMaterial.certificate.rawBytes' \
            checksums.txt.sig | fold -w 64 \
            | { echo '-----BEGIN CERTIFICATE-----'; cat; echo '-----END CERTIFICATE-----'; } \
            > checksums.txt.cert
          test -s checksums.txt.cert
          grep -q 'BEGIN CERTIFICATE' checksums.txt.cert
      - name: verify gate A — bundle form with install.sh identity constraints
        run: |
          cd dist
          cosign verify-blob \
            --bundle checksums.txt.sig \
            --certificate-identity-regexp "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            checksums.txt
      - name: verify gate B — --certificate track (supplementary form)
        # --certificate 轨（detached signature + bundle 提取证书）——与
        # gate A 的 --bundle 轨互为补充的验证形态：证明同一签名材料在两种
        # cosign 验证轨道下都验通。install.sh 现行面为 --bundle 轨（gate A
        # 覆盖，identity regexp / issuer 与 install.sh 逐字一致）。
        run: |
          cd dist
          jq -r '.messageSignature.signature' checksums.txt.sig > detached.b64
          cosign verify-blob \
            --signature detached.b64 \
            --certificate checksums.txt.cert \
            --certificate-identity-regexp "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            checksums.txt
      - name: sign checksums.txt (openssl track / FLEETLY_RELEASE_KEY)
        # S14/H15：openssl 兼容轨——干净 VPS 无 cosign 常态下的消费端验签
        # 材料（install.sh/upgrade.sh 内嵌公钥验 checksums.txt.sig.pem）。
        # 算法 = RSA-2048 + SHA-256（dgst 轨；裁决理由见 deploy/install.sh
        # 公钥块注释）。secret 形态 = PEM 私钥全文（配置步骤见 deploy/README.md
        # 「release 签名密钥（openssl 轨）」小节）。secret 缺席 = 过渡期：
        # 跳过 + 警示（job 不红）；一旦配置，下一步 gate 强制校验内嵌公钥与
        # secret 配对（防「换了 secret 忘改脚本」的必炸 release）。
        id: olsign
        env:
          RELEASE_KEY: ${{ secrets.FLEETLY_RELEASE_KEY }}
        run: |
          cd dist
          if [ -z "$RELEASE_KEY" ]; then
            echo "::warning::secret FLEETLY_RELEASE_KEY not configured — openssl-track signature SKIPPED (transitional). cosign-less hosts cannot verify such releases; S14-hardened installers will refuse them."
            exit 0
          fi
          printf '%s' "$RELEASE_KEY" | openssl dgst -sha256 -sign /dev/stdin -out checksums.txt.sig.pem checksums.txt
          test -s checksums.txt.sig.pem
          ls -l checksums.txt.sig.pem
          echo "signed=1" >> "$GITHUB_OUTPUT"
      - name: verify gate C — openssl track self-verify + embedded pubkey gate
        # 仅在 secret 已配置时生效：① 用 secret 派生公钥自验签名（与
        # install.sh openssl 轨同一命令面）；② install.sh / upgrade.sh 内嵌
        # 公钥块必须与 secret 派生公钥逐字一致（脚本还内嵌测试公钥 = 必炸
        # release，此处拦下）；③ 两个脚本的 fingerprint-sha256 注释行与
        # secret 派生指纹一致（轮换流程的锚点防漂移）。
        env:
          RELEASE_KEY: ${{ secrets.FLEETLY_RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo 'FLEETLY_RELEASE_KEY absent — openssl-track gate skipped (transitional)'
            exit 0
          fi
          cd dist
          test -s checksums.txt.sig.pem
          KEYF="$RUNNER_TEMP/fleetly-release.key"
          PUBF="$RUNNER_TEMP/fleetly-release.pub"
          printf '%s' "$RELEASE_KEY" > "$KEYF"
          openssl pkey -in "$KEYF" -pubout -out "$PUBF"
          # ① 自验（install.sh openssl 轨同命令面）。
          openssl dgst -sha256 -verify "$PUBF" -signature checksums.txt.sig.pem checksums.txt
          # ② 内嵌公钥块逐字一致。抽取口径与 test-install.sh A11 相同：锚定
          # FLEETLY_RELEASE_PUBKEY= 赋值行（BEGIN 标记跟着赋值前缀，无法锚
          # 定行首）到 END 标记行，剥掉首行赋值前缀。
          for sh in install.sh upgrade.sh; do
            sed -n "/^FLEETLY_RELEASE_PUBKEY='/,/-----END PUBLIC KEY-----/p" \
              "$GITHUB_WORKSPACE/deploy/$sh" | sed "1s/^FLEETLY_RELEASE_PUBKEY='//" \
              > "$RUNNER_TEMP/embedded-$sh.pub"
            diff "$PUBF" "$RUNNER_TEMP/embedded-$sh.pub" ||
              { echo "::error::deploy/$sh embedded FLEETLY_RELEASE_PUBKEY does not match FLEETLY_RELEASE_KEY — update the embedded key + fingerprint (see deploy/README.md release signing key section)"; exit 1; }
          done
          # ③ 指纹行一致。
          FP=$(openssl pkey -pubin -in "$PUBF" -outform DER | openssl dgst -sha256 | awk '{print $NF}')
          for sh in install.sh upgrade.sh; do
            grep -q "fingerprint-sha256: $FP" "$GITHUB_WORKSPACE/deploy/$sh" ||
              { echo "::error::deploy/$sh fingerprint-sha256 comment does not match FLEETLY_RELEASE_KEY ($FP)"; exit 1; }
          done
          rm -f "$KEYF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.olsign.outputs.signed == '1'
        with:
          name: release-signature-openssl
          path: dist/checksums.txt.sig.pem
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signature
          path: |
            dist/checksums.txt.sig
            dist/checksums.txt.cert
          if-no-files-found: error

  # ────────────────────────────────────────────── 5. ghcr 镜像 + 签名 ────
  image:
    name: ghcr image + cosign sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.fleetlyd
          push: true
          build-args: |
            FLEETLY_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.version }}
          # v0.1 容器形态是「可选运行形态」：amd64 单平台（arm64 运行形态走
          # tarball/安装器）；多平台镜像（QEMU）列遗留。
          platforms: linux/amd64
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign sign image (keyless, by digest)
        run: |
          cosign sign --yes \
            '${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}'
      - name: cosign verify image gate
        run: |
          cosign verify \
            '${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}' \
            --certificate-identity-regexp "$EXPECTED_SIGNER" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER"

  # ────────────────────────────── 5b. dbtools 镜像（E4 D-DB-6，W4-S6）────
  dbtools-image:
    # dbtools 备份/恢复作业镜像随平台 release 同版发布（E4 managed-databases
    # D-DB-6「执行体」：镜像 digest 钉定随平台 release——Go 侧消费 =
    # internal/database DefaultDatabaseToolsImage，check-image-pins 互补钉
    # 死）。可复用工作流 = .github/workflows/dbtools.yml 的 workflow_call
    # 入口（签名/验证门与 fleetlyd 镜像同款）。与 image job 同为镜像发布
    # 面：不进 publish.needs——镜像发布不阻断 GitHub Release 装配（与
    # image job 对 publish 的关系等价或更弱，镜像失败各自红，不拖累制品链）。
    name: dbtools image (workflow_call)
    uses: ./.github/workflows/dbtools.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    # dbtools.yml 内的飞书通知需要 FEISHU_WEBHOOK_URL；workflow_call 默认
    # 不透传 secrets，这里显式继承。
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  # ────────────────────────────── 5c. exec relay 镜像（E7 D-W5-3，W5-S6）────
  exec-image:
    # Web 终端执行中继镜像随平台 release 同版发布（E7 设计 §2.2「第二个第
    # 一方平台镜像」：Go 侧消费 = internal/execrelay DefaultExecRelayImage，
    # CI 首推后钉 digest 收紧）。可复用工作流 = .github/workflows/exec.yml
    # 的 workflow_call 入口（签名/验证门与 fleetlyd/dbtools 镜像同款）。
    # 与 image/dbtools job 同为镜像发布面：不进 publish.needs——镜像失败
    # 各自红，不拖累制品链。
    name: exec image (workflow_call)
    uses: ./.github/workflows/exec.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write

  # ────────────────────────────── 6b. arm64 原生构建冒烟（T0-V2.3）────────
  smoke-arm64:
    # arm64 release 冒烟：此前 build matrix 的 arm64 腿只验产物存在（交叉
    # 编译证明），运行验证以 QEMU 成本为由列遗留（交付 §M1）。本 job 在
    # GitHub 托管 arm64 runner 上原生跑 build + 单测冒烟，arm64 二进制真机
    # 可执行性自此有证据；红则阻断 publish（见 publish.needs）。
    # runner 口径：ubuntu-24.04-arm 为 GitHub 托管 arm64 runner，公共仓库
    # 免费；私有仓库按分钟计费（需 larger runner 付费配置）。本仓可见性
    # 无法在本地判定，按公共仓库口径编写；若仓库转私有，须改自管 runner
    # 或显式裁决撤下本 job。首发实跑（T2.26 打 tag）时复核一次。
    # 冒烟口径：build 与 build job 同参（CGO off + trimpath；不注版本——
    # version 命令只验证真机可执行）；单测全量但不带 -race（race 面 pr.yml
    # 已在 amd64 门禁覆盖，arm64 关注原生执行正确性）。
    name: arm64 smoke (native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: build (native arm64, same flags as build job)
        run: |
          GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/fleetlyd ./cmd/fleetlyd
          GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/fleetly ./cmd/fleetly
      - name: binary smoke (native execution self-report)
        run: |
          echo "host arch: $(uname -m)"
          [ "$(uname -m)" = "aarch64" ]
          test -s dist/fleetlyd && test -s dist/fleetly
          ./dist/fleetly version
      - name: unit test smoke (full suite, no race)
        run: go test ./... ./sdk/go/... -count=1

  # ────────────────────────────────────────────────── 6. GitHub Release ──
  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build, checksums, sbom, sign, image, smoke-arm64]
    steps:
      # gh release --verify-tag 需要 git 上下文（gh 内部 shell 出 git 命令）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: ver
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: collect release files (flat layout)
        run: |
          mkdir -p rel
          mv dist/fleetly_*.tar.gz rel/
          mv dist/checksums.txt dist/checksums.txt.sig dist/checksums.txt.cert rel/
          # openssl 轨签名为条件产物（FLEETLY_RELEASE_KEY 配置即存在）。
          if [ -f dist/checksums.txt.sig.pem ]; then
            mv dist/checksums.txt.sig.pem rel/
          fi
          mv dist/install.sh dist/uninstall.sh dist/upgrade.sh rel/
          mv dist/fleetly_*.spdx.json rel/
          ls -la rel/
      - name: release notes (engine matrix + install + verification)
        run: |
          V='${{ steps.ver.outputs.version }}'
          cat > rel/notes.md <<NOTES
          ## fleetly $V

          ### 安装（一条命令）

          \`\`\`sh
          curl -fsSL https://fleetly.dev/install.sh | sudo sh -
          # 钉定本版本：
          curl -fsSL https://fleetly.dev/install.sh | sudo sh - --version $V
          \`\`\`

          支持平台：linux amd64 / arm64（干净 VPS，root，安装器自带引擎门禁）。

          ### 引擎支持矩阵（architecture §4.2）

          | Docker Engine | 状态 |
          |---|---|
          | >= 29.8.1 | 支持（门禁下限，硬门禁） |
          | 29.7.x | 上一受支持 minor（nightly V7 矩阵回归覆盖） |
          | < 29.7 | 不支持（安装器拒绝；29.x 有破坏史） |
          | nftables-only 后端 | 暂不支持 Swarm 节点（安装器拒绝并给修复提示） |

          ### 制品

          | 文件 | 说明 |
          |---|---|
          | \`fleetly_${V}_linux_<arch>.tar.gz\` | fleetlyd + fleetly（包根） |
          | \`checksums.txt\` | 全部制品 sha256（安装器必验） |
          | \`checksums.txt.sig\` | Sigstore bundle 签名（cosign keyless，GitHub OIDC） |
          | \`checksums.txt.sig.pem\` | openssl 轨签名（RSA-2048/SHA-256；S14——无 cosign 主机的安装器内嵌公钥验此件，FLEETLY_RELEASE_KEY 配置后附带） |
          | \`checksums.txt.cert\` | 签名证书（PEM） |
          | \`install.sh\` / \`uninstall.sh\` / \`upgrade.sh\` | 安装 / 卸载 / 平台自升级 |
          | \`*.spdx.json\` | SBOM（syft，SPDX JSON） |

          ### 完整性验证

          \`\`\`sh
          sha256sum -c <(grep 'fleetly_${V}_linux_amd64' checksums.txt)
          # checksums 签名（cosign >= 2.6 / 3.x，Sigstore bundle 形态）：
          cosign verify-blob --bundle checksums.txt.sig \\
            --certificate-identity-regexp '^https://github\\.com/fleetlyrun/fleetly/' \\
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
            checksums.txt
          # 无 cosign 主机（openssl 轨，S14）——公钥 = install.sh 内嵌的
          # FLEETLY_RELEASE_PUBKEY：
          openssl dgst -sha256 -verify release.pub -signature checksums.txt.sig.pem checksums.txt
          \`\`\`

          镜像：\`${{ env.GHCR_IMAGE }}:$V\`（cosign keyless 签名，同 identity 约束；
          v0.1 容器形态为可选运行形态，主形态仍为宿主二进制 + systemd）。
          NOTES
      - name: create release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V='${{ steps.ver.outputs.version }}'
          # openssl 轨签名为条件产物——在则一并上传。
          set -- rel/fleetly_*.tar.gz rel/checksums.txt \
            rel/checksums.txt.sig rel/checksums.txt.cert \
            rel/install.sh rel/uninstall.sh rel/upgrade.sh \
            rel/*.spdx.json
          if [ -f rel/checksums.txt.sig.pem ]; then
            set -- "$@" rel/checksums.txt.sig.pem
          fi
          gh release create "$V" --verify-tag \
            --title "fleetly $V" \
            --notes-file rel/notes.md
          gh release upload "$V" "$@" --clobber

  # 飞书通知（共用 .github/actions/feishu-notify）：发版链路成败都推。
  # dbtools-image 不进 publish.needs（镜像失败各自红，不拖累制品链），
  # 但通知要覆盖它——needs 全量收口，任何一环红即报失败。
  notify:
    name: Feishu notify
    needs: [build, checksums, sbom, sign, image, dbtools-image, smoke-arm64, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/feishu-notify
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          detail: build=${{ needs.build.result }} checksums=${{ needs.checksums.result }} sbom=${{ needs.sbom.result }} sign=${{ needs.sign.result }} image=${{ needs.image.result }} dbtools-image=${{ needs.dbtools-image.result }} smoke-arm64=${{ needs.smoke-arm64.result }} publish=${{ needs.publish.result }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
