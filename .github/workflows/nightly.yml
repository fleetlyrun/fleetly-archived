# nightly 轨道（交付流水线 docs/design/2026-09-17-delivery-pipeline.md §2.2、
# §6 V1-V7 映射；P3：V1-V7 从一次性 Spike 升级为永久回归测试）。
#
# T1.4 落地 V1/V2/V3/V4/V6a/V6b 的可自动化子集（spike/b、spike/c 转译）：
#   V1  health 失败→paused+旧任务服务（含 B2 归位）   spike/b in-b1-v1b2
#   V2  本地 digest 引用零 pull                        spike/a e5-v2-digest
#   V3  更新窗口路由零失败+VIP 稳定                    spike/b in-b3-v3v4
#   V4  连接治理最小子集（abrupt 502 复现 / 优雅退出零失败 /
#       serversTransport 辅助）                        spike/b in-b3d+in-b3
#   V6  V6a 空卷事故+硬钉住 / V6b drain-回岗（双 dind 组网，spike/c c3a/
#       c3b/c4a 现成形态）                             spike/c
#   V5/V5b 维持 T1.4「不可 CI 化」裁决：宿主 docker 依赖编排 + 25 分钟连续性
#   采样，转译成本高——占位 job if:false 保留，不强行自动化。
#
# T2.24 扩容（交付 §4 M1 验收线）：
#   - engine-matrix（V7 落地，§2.2 nightly 第 1 项 / §2.3 引擎门禁流程）：
#     matrix = DIND_IMAGE {29.8.1, 29.7.2} × storage {containerd 缺省,
#     overlay2}，每格跑 V1/V3/V4/V6（交付 §2.3 引擎升级回归面）。
#     覆盖映射表：
#       | 格                  | 断言面   | 说明                         |
#       | 29.8.1×containerd   | V1/V3/V4/V6 | 基线（与基线 job 同构，控制格）|
#       | 29.8.1×overlay2     | V1/V3/V4/V6 | 存储驱动回归                 |
#       | 29.7.2×containerd   | V1/V3/V4/V6 | 上一受支持 minor 回归        |
#       | 29.7.2×overlay2     | V1/V3/V4/V6 | 双因子交叉                   |
#     V2 不进矩阵：其断言（digest 零 pull）与引擎/存储形态正交，且取证依赖
#     专用全新 dind 的 dockerd 日志；保留独立基线 job 单跑。
#   - upgrade-e2e / install-suite：T2.23 / T2.1 的 dind 验收直接进 nightly
#     （deploy/run-upgrade-test.sh、deploy/run-dind-test.sh，自足编排）。
#   - conformance-builder：Builder conformance（场景 A Dockerfile 驱动 / B
#     railpack 检测裁决 / C 坏 Dockerfile E_BUILD_FAILED 信封）。ObjectStore
#     conformance 已随 E3-7 落地（FZ-7 闭环，2026-09-21）：conformance-
#     objectstore job 对真 RustFS 全量断言——见 e2e/nightly/README.md。
#   - resource-sample：控制面 idle 资源基线采样（RSS + docker stats），产物
#     附加 artifact 供 T2.25 趋势线；趋势告警不阻断。
#   - s3-rustfs-e2e：E3 对象存储端到端（e2e/s3-rustfs.sh，单 dind；E3-4/5
#     真机闭环 + E3-6 公网开关断言面在单测——dind 无 base_domain 形态无公
#     网面，e2e 断言范围见脚本头注释）。
#   - databases-e2e：E4 数据库托管端到端（e2e/databases.sh，单 dind；
#     s3-rustfs-e2e 同骨架——建库健康门/卷放置/备份恢复/轮换重部署/密钥库
#     挂载/删除守卫全链；dbtools 私有镜像经 GITHUB_TOKEN 登录 ghcr 后由脚
#     本 save|load 注入 dind）。
#   - logs-victorialogs-e2e：E6 W5-S1 VictoriaLogs 默认捆绑端到端
#     （e2e/logs-victorialogs.sh，单 dind；s3-rustfs 同骨架）：收敛管理器缺省
#     收敛/回环健康/入湖可查（SearchLogs 命中）/keyword 过滤/注入负向/
#     降级 streak + 直播不受影响/backend 切换（卷保留）+ 复切收敛。
#
# 每个步骤与本地可跑脚本一致：bash e2e/nightly/run.sh <suite> /
# sh deploy/run-*.sh / bash e2e/nightly/conformance-builder.sh /
# bash e2e/nightly/resource-sample.sh（本地复跑见 e2e/nightly/README.md 与
# deploy/README.md）。
name: nightly

# F1（S20 交付/CI 修正）：全部 uses 钉 commit SHA，注释保留版本号便于人读
#（升级 action = 同时改 SHA 与版本注释）。SHA 于 2026-09-19 经 GitHub API
# /commits/<tag> 解析并经 tags 列表 / git ls-remote 交叉核验。

on:
  schedule:
    - cron: "47 21 * * *" # 每日一次（21:47 UTC，避开整点任务高峰）
  workflow_dispatch: # 主会话验收手动触发实跑

permissions:
  contents: read
  packages: read # databases-e2e 的 GITHUB_TOKEN 需拉私有 dbtools ghcr 包

concurrency:
  # 定时与手动触发不互相取消（红即阻断发版证据，不允许重试掩盖）
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # dind 镜像钉 digest（T0-V2.3 供应链）：tag 保留作可读性，digest 为准
  #（V7 矩阵在 job 级用 matrix.engine 覆盖）。
  DIND_IMAGE: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0

jobs:
  # ───────────────────────── 基线 suite jobs（T1.4 原样；29.8.1 缺省存储）───
  v1-health-gate:
    # V1（含 B2 归位零成本）：health 失败时更新 paused、旧任务不中断、
    # 外部探测零失败；同内容重放旧 task id 不变。
    name: V1 health-gate (+B2 replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run V1 regression (dind)
        # F2：TMPDIR 钉取证目录根（run.sh 的 mktemp -d 自动遵循），失败时
        # run.sh 保留 $TMP 并打印路径，下方 upload 步骤收取同一根。
        env:
          TMPDIR: ${{ runner.temp }}/nightly-forensics
        run: |
          mkdir -p "$TMPDIR"
          bash e2e/nightly/run.sh v1
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-nightly- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 100 || true'
      - name: upload forensics on failure
        # F2：$TMP 全量取证（dind 全量日志 + 套件 artifacts）。
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-forensics-v1
          path: ${{ runner.temp }}/nightly-forensics
          if-no-files-found: warn
      - name: cleanup
        if: always()
        run: |
          docker ps -aq --filter name=fleetly-nightly- | xargs -r docker rm -f
          docker network rm fleetly-nightly-br || true

  v2-digest-nopull:
    # V2：service 以 名称@sha256:<本地 imageID> 创建与 --force 重放零 pull；
    # dockerd 日志 pull 取证在宿主侧（run.sh），tag 引用对照证明检测通道。
    # 不进 V7 引擎矩阵：断言与引擎/存储形态正交（见文件头覆盖映射表）。
    name: V2 digest zero-pull
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: run V2 regression (dind)
        # F2：同 v1（取证目录钉 TMPDIR，失败保留 + upload 收取）。
        env:
          TMPDIR: ${{ runner.temp }}/nightly-forensics
        run: |
          mkdir -p "$TMPDIR"
          bash e2e/nightly/run.sh v2
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-nightly- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 100 || true'
      - name: upload forensics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-forensics-v2
          path: ${{ runner.temp }}/nightly-forensics
          if-no-files-found: warn
      - name: cleanup
        if: always()
        run: docker ps -aq --filter name=fleetly-nightly- | xargs -r docker rm -f

  v3-routing:
    # V3：健康滚动更新窗口内经 Traefik→VIP 路由零失败；VIP 前后不变。
    name: V3 routing zero-failure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run V3 regression (dind)
        # F2：同 v1（取证目录钉 TMPDIR，失败保留 + upload 收取）。
        env:
          TMPDIR: ${{ runner.temp }}/nightly-forensics
        run: |
          mkdir -p "$TMPDIR"
          bash e2e/nightly/run.sh v3
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-nightly- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 100 || true'
      - name: upload forensics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-forensics-v3
          path: ${{ runner.temp }}/nightly-forensics
          if-no-files-found: warn
      - name: cleanup
        if: always()
        run: |
          docker ps -aq --filter name=fleetly-nightly- | xargs -r docker rm -f
          docker network rm fleetly-nightly-br || true

  v4-conn-governance:
    # V4 最小子集：abrupt 后端 in-flight POST 必现 502（事故类仍可检出）；
    # 优雅退出 + stop-grace>drain 零失败；serversTransport 辅助断言
    # （keep-alive GET 跨更新零失败 + 配置干净应用）。
    name: V4 connection governance (subset)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run V4 regression (dind)
        # F2：同 v1（取证目录钉 TMPDIR，失败保留 + upload 收取）。
        env:
          TMPDIR: ${{ runner.temp }}/nightly-forensics
        run: |
          mkdir -p "$TMPDIR"
          bash e2e/nightly/run.sh v4
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-nightly- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 100 || true'
      - name: upload forensics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-forensics-v4
          path: ${{ runner.temp }}/nightly-forensics
          if-no-files-found: warn
      - name: cleanup
        if: always()
        run: |
          docker ps -aq --filter name=fleetly-nightly- | xargs -r docker rm -f
          docker network rm fleetly-nightly-br || true

  v6-placement:
    # V6a/V6b（双 dind 组网）：无约束迁移得空卷 / 硬钉住 kill→PENDING→重启
    # 自动回绑数据在 / drain→blocked→active 回岗数据在。
    # 多节点 dind 在共享 runner 上的稳定性按交付 §5 风险跟踪：只放 nightly，
    # 连续失败开 issue 而非重试掩盖。
    name: V6a/V6b placement (dual-dind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run V6 regression (dual dind)
        # F2：同 v1（取证目录钉 TMPDIR，失败保留 + upload 收取；v6 artifacts
        # 在 $TMP/artifacts 下，一并入包）。
        env:
          TMPDIR: ${{ runner.temp }}/nightly-forensics
        run: |
          mkdir -p "$TMPDIR"
          bash e2e/nightly/run.sh v6
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-nightly- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 100 || true'
      - name: upload forensics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-forensics-v6
          path: ${{ runner.temp }}/nightly-forensics
          if-no-files-found: warn
      - name: cleanup
        if: always()
        run: |
          docker ps -aq --filter name=fleetly-nightly- | xargs -r docker rm -f
          docker network rm fleetly-nightly-br || true

  v5-recovery-drill:
    # 占位（T1.4 裁决，T2.24 复核后维持）：V5 单 manager 故障恢复 + V5b raft
    # 回退孤儿命运依赖宿主侧「停止态 docker cp 冷备 tar / 同 IP 换容器」编排
    # （spike/c/scripts/v5-up.bat → v5-backup.bat → v5-death-restore.bat，
    # 全程 ~12 分钟 + 25 分钟 worker 连续性采样），转译为 CI 步骤的成本高，
    # 不强行自动化。落地跟踪：e2e/nightly/README.md 清单表「未自动化项」。
    name: V5/V5b recovery drill (placeholder)
    if: false # 占位：转译 v5-*.bat 编排后启用（T1.4 裁决维持）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "placeholder — V5/V5b orchestration not yet automated; see e2e/nightly/README.md"

  # ─────────────────────────────── V7 引擎矩阵（T2.24；交付 §2.2/§2.3）─────
  engine-matrix:
    # V7 引擎升级回归矩阵：DIND_IMAGE {29.8.1, 29.7.2} × storage
    # {containerd 缺省, overlay2} 四格，每格顺序跑 V1/V3/V4/V6（交付 §2.3
    # 引擎升级回归面；Docker 29.x 破坏史要求 minor 升级必须携带回归证据）。
    # fail-fast: false——红格各自暴露，不互相掩盖；DIND_IMAGE/DIND_EXTRA_ARGS
    # 是 run.sh 的既有环境钩子（引擎版本由镜像钉定，脚本内无版本断言）。
    name: V7 engine ${{ matrix.engine }} / ${{ matrix.storage.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine:
          # 钉 digest（T0-V2.3 供应链）：多架构 index，amd64/arm64 通吃。
          - docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
          - docker:29.7.2-dind@sha256:3ef33f2e220b79ed3ef3b99d81746f06f306cd6340e2cb7331d17ae996e74cb6
        storage:
          - id: containerd
            args: ""
          - id: overlay2
            args: "--storage-driver overlay2"
    env:
      DIND_IMAGE: ${{ matrix.engine }}
      DIND_EXTRA_ARGS: ${{ matrix.storage.args }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: engine identity
        run: |
          echo "engine image: $DIND_IMAGE"
          echo "storage extra args: [$DIND_EXTRA_ARGS]"
      - name: run V1/V3/V4/V6 regression on this engine leg
        # F2：同 v1（取证目录钉 TMPDIR，失败保留 + upload 收取）。artifact
        # 名用 strategy.job-index（matrix.engine 含 ':/' 非法字符）。
        env:
          TMPDIR: ${{ runner.temp }}/nightly-forensics
        run: |
          mkdir -p "$TMPDIR"
          bash e2e/nightly/run.sh v1 v3 v4 v6
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-nightly- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 100 || true'
      - name: upload forensics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-forensics-engine-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-forensics
          if-no-files-found: warn
      - name: cleanup
        if: always()
        run: |
          docker ps -aq --filter name=fleetly-nightly- | xargs -r docker rm -f
          docker network rm fleetly-nightly-br || true

  # ───────────────────────────── T2.23 / T2.1 验收入 nightly（T2.24）────────
  upgrade-e2e:
    # T2.23 自升级 dind 验收（升级 E2E 47 断言：应用不停 probe 零失败 +
    # 坏件自动回退 + 备份台账）。编排自足：交叉编译/注入/清理全在
    # deploy/run-upgrade-test.sh，与本地同一条命令。
    name: upgrade E2E (run-upgrade-test.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run upgrade suite (dind)
        run: sh deploy/run-upgrade-test.sh
      - name: cleanup
        if: always()
        run: docker ps -aq --filter name=fleetly-upgrade-test | xargs -r docker rm -f

  install-suite:
    # T2.1 安装器 dind 验收（51 断言：安装/门禁/幂等/卸载全链）。
    # 编排自足：deploy/run-dind-test.sh，与本地同一条命令。
    name: install suite (run-dind-test.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run installer suite (dind)
        run: sh deploy/run-dind-test.sh
      - name: cleanup
        if: always()
        run: docker ps -aq --filter name=fleetly-install-test | xargs -r docker rm -f

  multinode-rehearsal:
    # E1-9 多节点演练的 dind 双节点形态（multi-node §4.2 三断言 dind 适配 +
    # D-MN-1 auto-rotate 端到端：join→锚定→token 自动轮换→旧 token 拒绝）。
    # 编排自足：e2e/multinode-rehearsal.sh（mgr+w1 双 dind 私网组网，镜像钉
    # digest；zot/DNS/预算断言面在 dind 无输入，脚本内 SKIP 行标注归真 VPS
    # 形态）。多节点 dind 在共享 runner 上的稳定性按交付 §5 风险跟踪（同
    # v6-placement）：正常断言挂法（红即暴露，不用 continue-on-error 掩盖），
    # 连续失败开 issue 而非重试掩盖。
    name: multinode rehearsal (dual-dind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run multinode rehearsal (dual dind)
        run: sh e2e/multinode-rehearsal.sh
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-rehearsal- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 120 || true'
      - name: cleanup
        if: always()
        run: |
          docker ps -aq --filter name=fleetly-rehearsal- | xargs -r docker rm -f
          docker network rm fleetly-rehearsal-br || true

  # ───────────────────────── FZ-7 conformance / E3 e2e（E3-7，2026-09-21）──
  conformance-objectstore:
    # FZ-7 conformance（E3-7，设计 docs/design/2026-09-20-object-storage.md
    # §2.7）：internal/objectstore 封闭操作面对真 RustFS 实例全量断言——
    # ensure 幂等 / put-get 字节往返 / stat 元数据 / list 前缀 / delete /
    # TestConnection 探针协议 / path-style 行为 / 403 负路径。RustFS 容器起
    # 在 runner 宿主（非 dind——纯客户端面，无需集群）；测试内不起容器，凭
    # 据经 env 注入（FLEETLY_CONFORMANCE_S3_*；env 未设 = 本地零成本 skip，
    # 本地默认零成本）。镜像钉 digest（T0-V2.3 供应链；台账
    # docs/runbooks/image-prepull.md #12）；凭据是随容器生灭的一次性测试凭
    # 据，非 secret。
    name: conformance objectstore (RustFS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: start pinned RustFS
        run: |
          docker run -d --name fleetly-conformance-rustfs \
            -p 9000:9000 \
            -e RUSTFS_ADDRESS=":9000" \
            -e RUSTFS_ACCESS_KEY=fleetly-conformance \
            -e RUSTFS_SECRET_KEY=fleetly-conformance-secret \
            rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
          # 就绪门（60s）：/minio/health/live（MinIO 兼容健康面，2026-09-21
          # 本机实证 200；连接拒绝期 curl 非零）。
          deadline=$(( $(date +%s) + 60 ))
          until curl -sf -o /dev/null http://127.0.0.1:9000/minio/health/live; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::RustFS health endpoint not ready within 60s"
              docker logs fleetly-conformance-rustfs --tail 50 || true
              exit 1
            fi
            sleep 2
          done
      - name: run objectstore conformance against real RustFS
        env:
          FLEETLY_CONFORMANCE_S3_ENDPOINT: http://127.0.0.1:9000
          FLEETLY_CONFORMANCE_S3_ACCESS_KEY: fleetly-conformance
          FLEETLY_CONFORMANCE_S3_SECRET_KEY: fleetly-conformance-secret
          FLEETLY_CONFORMANCE_S3_BUCKET: fleetly-conformance
        run: go test ./internal/objectstore/ -run TestConformance -v -count=1
      - name: dump rustfs logs on failure
        if: failure()
        run: docker logs fleetly-conformance-rustfs --tail 100 || true
      - name: cleanup
        if: always()
        run: docker rm -f fleetly-conformance-rustfs

  s3-rustfs-e2e:
    # E3 对象存储端到端（E3-4/E3-5 真机闭环，e2e/s3-rustfs.sh 单 dind；
    # multinode-rehearsal 同骨架——编排自足、镜像钉 digest 在脚本头常量）：
    # A0 前置校验（E_S3_NOT_CONFIGURED）→ A1 收敛管理器收敛+探针 → A2 注入与
    # 读写闭环 → A3 上传轨 → A3.5 诚实口径 → A4 禁用留卷 → A5 状态面。
    # 与 conformance-objectstore 分立为两个 job：前者纯客户端面（分钟级），
    # 本 job 交叉编译 + dind 编排（十分钟级），失败域互不牵连。
    # E3-6 公网子域开关的 e2e 断言不在本套件（dind 离线形态无 base_domain
    # ——公网面收敛由 ingress 单测承担：视图增/摘 + SAN 条件 + 开关往返
