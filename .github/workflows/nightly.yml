    # AUTH-8 用户管理（CreateUser/Disable/Enable/ResetPassword 重置即全端
    # 下线）。REST 会话面用钉 digest curlimages/curl helper（cookie jar）；
    # 不部署受管应用、dind 内零 pull——无需任何 ghcr 凭据。
    name: auth e2e (dind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run auth e2e (dind)
        run: sh e2e/auth.sh
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-auth-e2e- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 120 || true'
      - name: cleanup
        if: always()
        run: |
          docker ps -aq --filter name=fleetly-auth-e2e- | xargs -r docker rm -f
          docker network rm fleetly-auth-br || true

  rbac-e2e:
    # v0.3 W2 RBAC 端到端（e2e/rbac.sh 单 dind；rbac-teams 设计 §3.2/§3.3/
    # §4.2/§8「e2e 新增 rbac.sh」，auth 同骨架——编排自足、镜像钉 digest）：
    # RB-1 角色矩阵抽检（viewer 拒部署/developer 拒 env 明文+可部署可终端
    # ticket/机具令牌全库+团队读面恒拒）→ RB-2 项目覆写四断言（developer
    # 降 viewer 拒部署/viewer 升 developer 可部署且单项目作用域/owner 恒不
    # 覆写/移出团队清覆写）→ RB-3 跨项目库引用拒绝（E_DB_PROJECT_MISMATCH）
    # → RB-4 MoveApp 改派（换名重部署 + 权限随迁）→ RB-5 列表过滤
    # （?project= 收窄 + 跨队隔离 + 404 不泄漏）→ RB-6 SearchLogs 裸名选择
    # 器 400。受管应用负载 = 公共 curlimages/curl（sleep infinity 长驻——
    # 部署真收敛且无 ghcr 私有依赖）。
    name: rbac e2e (dind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run rbac e2e (dind)
        run: sh e2e/rbac.sh
      - name: dump dind logs
        if: failure()
        run: |
          docker ps -a --filter name=fleetly-rbac-e2e- --format '{{.Names}}' |
            xargs -r -n1 sh -c 'echo "===== $0 ====="; docker logs "$0" --tail 120 || true'
      - name: cleanup
        if: always()
        run: |
          docker ps -aq --filter name=fleetly-rbac-e2e- | xargs -r docker rm -f
          docker network rm fleetly-rbac-br || true

  # ───────────────────────────────────── conformance / 资源采样（T2.24）────
  conformance-builder:
    # Builder conformance（ObjectStore 部分已随 E3-7 落地为
    # conformance-objectstore job，FZ-7 闭环——见上方独立 job）：
    #   场景 A  Dockerfile 驱动构建 → 成功 + digest + 部署 succeeded + 路由
    #   场景 B  无 Dockerfile（railpack 检测）→ 裁决正确（成功或带证据的
    #           E_BUILD_FAILED；工具链下载受外网影响，结论进 summary）
    #   场景 C  坏 Dockerfile → E_BUILD_FAILED 信封 + 部署 failed
    name: conformance builder (A/B/C)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run builder conformance (dind)
        # pipefail 保 rc；CB-* 断言行与场景 B 结论收进 job summary。
        run: |
          set -o pipefail
          bash e2e/nightly/conformance-builder.sh 2>&1 | tee "$RUNNER_TEMP/cb.log"
      - name: job summary
        if: always()
        run: |
          {
            echo '## Builder conformance results'
            echo ''
            grep -E 'CB-(P|A|B|C)[0-9].*(PASS|FAIL)|CB-B-OUTCOME' "$RUNNER_TEMP/cb.log" |
              sed 's/^/    /' || echo '(no CB-* lines found — suite did not reach assertions)'
            echo ''
            echo "ObjectStore conformance: covered by the conformance-objectstore job (FZ-7 closed, E3-7 2026-09-21)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cleanup
        if: always()
        # 容器 + fleetly-cb-br 私网（v0.3 归属管道 fixture 引入；脚本 trap
        # 常规自清，此处兜底 cancel/timeout 残留——与上方 suite job 清
        # fleetly-nightly-br 同款）。
        run: |
          docker ps -aq --filter name=fleetly-conformance-builder | xargs -r docker rm -f
          docker ps -aq --filter name=fleetly-conformance-builder-curl | xargs -r docker rm -f
          docker network rm fleetly-cb-br || true

  resource-sample:
    # 控制面 idle 资源基线采样（交付 §2.2 nightly 第 5 项；趋势告警不阻断，
    # 为 T2.25 提供第一份 CI 样本）：dind 内 --no-systemd 起 daemon → 稳定
    # 60s → fleetlyd RSS 多拍（/proc/<pid>/status VmRSS）+ docker stats 逐
    # 容器单列（Traefik / buildkit 按实际在跑如实列出）。Markdown 表进 job
    # summary，JSON 附加 artifact 供趋势对比。
    name: resource sample (idle baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: run resource sampler (dind)
        env:
          RS_OUT_DIR: ${{ github.workspace }}/resource-sample
        run: bash e2e/nightly/resource-sample.sh
      - name: job summary
        if: always()
        env:
          RS_OUT_DIR: ${{ github.workspace }}/resource-sample
        run: cat "$RS_OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '(summary.md missing — sampler failed)'
      - name: upload sample artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resource-sample
          path: resource-sample/sample.json
          if-no-files-found: warn
      - name: cleanup
        if: always()
        run: docker ps -aq --filter name=fleetly-resource-sample | xargs -r docker rm -f

  # 飞书通知（共用 .github/actions/feishu-notify）：nightly 红即阻断发版
  # 证据，失败必须当天可见；成功静默（日常绿是预期态）。v5 占位恒 skipped
  # 不计失败；engine-matrix 任一格红即整体 failure。
  notify:
    name: Feishu notify
    needs: [v1-health-gate, v2-digest-nopull, v3-routing, v4-conn-governance, v6-placement, v5-recovery-drill, engine-matrix, upgrade-e2e, install-suite, multinode-rehearsal, conformance-objectstore, s3-rustfs-e2e, databases-e2e, conformance-builder, resource-sample, scaling-e2e]
    if: ${{ !cancelled() && failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/feishu-notify
        with:
          status: failure
          detail: v1=${{ needs.v1-health-gate.result }} v2=${{ needs.v2-digest-nopull.result }} v3=${{ needs.v3-routing.result }} v4=${{ needs.v4-conn-governance.result }} v6=${{ needs.v6-placement.result }} v5=${{ needs.v5-recovery-drill.result }} engine-matrix=${{ needs.engine-matrix.result }} upgrade-e2e=${{ needs.upgrade-e2e.result }} install-suite=${{ needs.install-suite.result }} multinode=${{ needs.multinode-rehearsal.result }} objectstore=${{ needs.conformance-objectstore.result }} s3-e2e=${{ needs.s3-rustfs-e2e.result }} databases-e2e=${{ needs.databases-e2e.result }} conformance-builder=${{ needs.conformance-builder.result }} resource-sample=${{ needs.resource-sample.result }} scaling-e2e=${{ needs.scaling-e2e.result }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
