    # D21-D22 暂停恢复 → D23-D27 删除守卫 + 默认留卷删除；M/G 腿同链
    # （mysql-8.4/mongodb-8.0）。
    # IMPL-DB-1 P 段（DT-9 目录矩阵）：postgres-18 与 percona-postgresql-18
    # 各跑 create→ready→引用 app→backup verified→清空→原地恢复→行回来；
    # percona 腿含 CREATE EXTENSION vector + vector(3) 数据回读。
