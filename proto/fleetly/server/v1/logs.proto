syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// LogsService 是应用日志面（T2.20；architecture §4.2 第 5 项「实时流 +
// 历史落盘检索」）。
//
// Follow 是 server-streaming（gRPC 帧 / gateway chunked-JSON 双面同源）；
// Secret 值已在采集端脱敏（internal/logs：只脱该 app env 已知值），本面
// 不再二次处理。History 覆盖落盘检索（按 app/service/时间窗），source
// 字段区分容器日志与构建日志（builds 表 log_path 产物）。
//
// gRPC-only 清单纪律（T2.17）：v0.1 Follow **也挂 gateway**（chunked
// JSON 流，Console SSE 可直接消费）——gRPC-only 清单当前为空；若后续
// Follow 出现二进制/高频帧形态不适宜 REST，在此显式登记并从 gateway
// 注册清单摘除（cmd/fleetlyd/gateway.go 同步维护）。
service LogsService {
  rpc FollowLogs(FollowLogsRequest) returns (stream FollowLogsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/logs/stream" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc ListHistoryLogs(ListHistoryLogsRequest) returns (ListHistoryLogsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/logs" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // SearchLogs 统一检索（E6 观测专项设计 §3.1，W5-S1）：日志库
  //（VictoriaLogs）LogsQL 检索面。keyword 构造为转义后的字面量短语
  //（用户输入永不裸拼进查询串）；VL 不可达或当前 backend=jsonl 时以
  // E_LOGS_BACKEND_UNAVAILABLE 诚实报错（不返回空列表冒充）。检索面只
  // 覆盖入湖窗口内的日志（切换前的 JSONL 历史不在检索面——设计 §2.3
  //「检索不跨界」的诚实边界）。
  rpc SearchLogs(SearchLogsRequest) returns (SearchLogsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/logs/search" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // GetLogsBackend 日志后端视图（W5-S1：mode / 是否显式设置 / 部署态 /
  // ingest streak / 丢弃计数——CLI `logs backend show` 与 Console 卡共面）。
  rpc GetLogsBackend(GetLogsBackendRequest) returns (GetLogsBackendResponse) {
    option (google.api.http) = { get: "/v1/logs-backend" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // SetLogsBackend 切换日志后端（victorialogs | jsonl）：保存即生效——
  // duty 收敛部署/移除（卷保留），采集路由下拍切换。
  rpc SetLogsBackend(SetLogsBackendRequest) returns (SetLogsBackendResponse) {
    option (google.api.http) = { put: "/v1/logs-backend" body: "*" };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
}

message FollowLogsRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // compose 服务名；空 = 该 app 全部服务。
  string service = 2;
}

message ListHistoryLogsRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // compose 服务名；空 = 全部服务。
  string service = 2;
  // 时间窗下界；缺省 = 保留窗起点。
  google.protobuf.Timestamp since = 3;
  // 时间窗上界；缺省 = 现在。
  google.protobuf.Timestamp until = 4;
  // 返回上限（缺省 200，天花板 1000；超过取最新 limit 条）。
  int32 limit = 5 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // 来源过滤：container | build；空 = 全部。
  string source = 6 [(buf.validate.field).string = {
    in: ["", "container", "build"]
  }];
}

// LogEntryView 是单条日志投影。source ∈ container | build。
message LogEntryView {
  string app = 1;
  string service = 2;
  google.protobuf.Timestamp at = 3;
  bool stderr = 4;
  string line = 5;
  string source = 6;
}

message FollowLogsResponse {
  LogEntryView entry = 1;
}

message ListHistoryLogsResponse {
  repeated LogEntryView entries = 1;
}

// SearchLogsRequest 统一检索输入（E6 设计 §3.1）。app 为路径参数（v0.2
// 只做 app 级检索——全局跨应用检索页挂账 v0.2.x）；apps/services/sources/
// tasks 为可选过滤集（空 = 不过滤该维度）。**DT-5 任务日志面（IMPL-T2-1）**：
// app 可空（仅当 tasks 非空且调用方为机具令牌/平台管理员）——任务行无 app
// 归属，task 流标签即归因面。
message SearchLogsRequest {
  // app 流选择器（三段限定形 team/prj/app 或裸名；用户凭据强制限定形）。
  // 空 = 仅按 tasks 选择器查询（任务日志；全局调用方限定）。
  string app = 1;
  // 可选的 app 过滤集（预留跨应用语义；当前检索面为单 app，额外值不
  // 放行——诚实边界）。
  repeated string apps = 2;
  // 全文关键词（构造为转义后的 LogsQL 字面量短语——注入安全硬性条款）。
  string keyword = 3;
  // 时间窗下界；缺省 = 不设下界（保留窗即 VL -retentionPeriod）。
  google.protobuf.Timestamp time_start = 4;
  // 时间窗上界；缺省 = 现在。
  google.protobuf.Timestamp time_end = 5;
  // compose 服务名过滤集。
  repeated string services = 6;
  // 来源过滤集：container | build | access（access 随 W5-S2 访问日志
  // 采集进入词表）。
  repeated string sources = 7;
  // 返回上限（缺省 200，天花板 1000）。
  int32 limit = 8 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // 分页游标（服务端签发的下一页凭证；空 = 第一页）。游标分页自最新
  // 命中向后走（VL limit/offset 语义）。
  string cursor = 9;
  // 任务流选择器（DT-5 任务日志面；值 = 任务平台 ID——入湖 task 流标签）。
  // 非空时 app 可空（任务行无 app 归属）。
  repeated string tasks = 10;
}

// SearchLogRow 是检索命中的单行（字段与入湖行对齐：_time/_msg/app/
// service/source/stderr——E6 设计 §3.1 行集契约；DT-5 增 task）。
message SearchLogRow {
  google.protobuf.Timestamp at = 1;
  string app = 2;
  string service = 3;
  string source = 4;
  bool stderr = 5;
  string msg = 6;
  // 访问行（source=access）的结构化字段透传（W5-S2 设计 §3.2：method/
  // status/host/path/route/duration_ms/client_ip/deployment_id——入湖
  // 白名单词表内回读；deployment_id 为滚动窗内**近似**归因，多副本滚动
  // 窗内外流量可能分属新旧两代部署）。container/build 行为空。
  map<string, string> fields = 7;
  // 任务归因（DT-5：任务行 = 任务平台 ID；其余行空）。
  string task = 8;
}

message SearchLogsResponse {
  repeated SearchLogRow rows = 1;
  // 下一页游标（空 = 没有更多命中）。
  string next_cursor = 2;
}

message GetLogsBackendRequest {}

// LogsBackendView 是日志后端视图（E6 设计 §2.2/§2.3 诚实口径：模式、
// 是否显式设置、部署态、ingest streak、丢弃计数常驻可见）。
message LogsBackendView {
  // 生效模式：victorialogs | jsonl（缺省 victorialogs——V2-1 默认捆绑；
  // 未显式设置时 mode 已投影为缺省值，set 标志区分「缺省生效」）。
  string backend = 1;
  // 该键是否被显式保存过（false = 缺省态生效）。
  bool backend_set = 2;
  // 部署态（backend=victorialogs 时）：deployed（服务在位）| pending
  //（duty 收敛中）| removed（backend=jsonl 或服务已移除）；面未装配
  //（测试形态）= unknown。
  string deployment = 3;
  // 入湖 streak 是否降级中（VL 不可达——检索降级，直播不受影响）。
  bool ingest_degraded = 4;
  // 降级 streak 起点（未降级不输出）。
  google.protobuf.Timestamp ingest_degraded_since = 5;
  // 进程启动以来溢出丢弃的累计行数。
  uint64 dropped_total = 6;
}

message GetLogsBackendResponse {
  LogsBackendView view = 1;
}

message SetLogsBackendRequest {
  string backend = 1 [(buf.validate.field).string = {
    in: ["victorialogs", "jsonl"]
  }];
}

message SetLogsBackendResponse {
  LogsBackendView view = 1;
}
