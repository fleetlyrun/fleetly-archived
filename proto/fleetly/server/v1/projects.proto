syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 teams.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// ProjectsService 是项目与队内覆写成员面（RBAC 设计 §3.3/§3.4/§5，v0.3
// W2-S1）。
//
// 项目面权限（本票自含，W2-S4 通用角色门之前的实现切面）：
//   - 全部方法要求用户凭据（会话或用户 PAT）——机具令牌恒 403（与
//     TeamsService 同口径）；
//   - 读面：团队成员（可见性零级联——可见项目集 = 团队归属，D-W0-2）；
//     平台管理员只读放行；
//   - 项目生命周期写面（创建/改名/删除）= 团队 owner（§3.2 矩阵「项目
//     创建/删除」行；改名未入矩阵，保守取 owner——见票面偏差记录）；
//   - 队内覆写成员面 = 团队 admin/owner（§3.3 明文）；覆写角色不授予
//     成员管理权（权限怪圈防线）。
//
// slug 纪律（§3.4）：单词制 [a-z0-9]{2,32}、team 内唯一、不可变——
// UpdateProject 无 slug 字段；同名项目跨团队允许（D-W0-9）。
// MoveApp / MoveDatabase 随 W2-S3 命名三段化落地（换名重部署编排见
// rbac-teams §3.4/§4.3；平台管理员专属）。
service ProjectsService {
  // CreateProject 在团队下建项目（owner 专属）；team 内 slug 冲突 409。
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (google.api.http) = {
      post: "/v1/projects"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // ListProjects 我可见项目（团队归属集）；带 team_id 收窄到单队（须为
  // 该队成员或平台管理员）；平台管理员不带过滤 = 全部。
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = { get: "/v1/projects" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (google.api.http) = { get: "/v1/projects/{id}" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // UpdateProject 仅改 name/description（slug 不可变——请求无 slug 字段）。
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (google.api.http) = {
      patch: "/v1/projects/{id}"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // DeleteProject 删除空项目：项目内有存活资源（apps 非 tombstone /
  // db_instances 非 deleted 终态）即拒绝（409——资源先迁走或删光，不做
  // 隐式级联，§3.1）。
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (google.api.http) = { delete: "/v1/projects/{id}" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse) {
    option (google.api.http) = { get: "/v1/projects/{project_id}/members" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // SetProjectMemberRole 队内覆写 upsert（团队 admin/owner，D-W0-2 B 形）：
  // 仅限团队成员；owner 不可覆写（409）；有行则改角色、无行则插入。
  rpc SetProjectMemberRole(SetProjectMemberRoleRequest) returns (SetProjectMemberRoleResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/members:set-role"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // RemoveProjectMember 删除覆写行（该成员回退用团队角色）。
  rpc RemoveProjectMember(RemoveProjectMemberRequest) returns (RemoveProjectMemberResponse) {
    option (google.api.http) = { delete: "/v1/projects/{project_id}/members/{user_id}" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // MoveApp 资源改派（v0.3 W2-S3，rbac-teams §3.4/§5；平台管理员专属）：
  // 写归属 + 换名重部署（D-W0-4 二修——底座命名三段以归属为参数）。无卷
  // 服务近零中断（建新名→等 running→删旧名）；有卷短暂停机窗口。跨团队/
  // 跨项目改派先过目标项目唯一性（409）。app 引用 = 裸名（解析域内唯一）
  // 或 `team/prj/app` 限定形或平台 ID；目标项目 = 平台 ID（D-W0-9：管理面
  // 用 ID，免疫重名）。
  rpc MoveApp(MoveAppRequest) returns (MoveAppResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{to_project_id}:move-app"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // MoveDatabase 资源改派（同 MoveApp 语义；库卷公式不变——零卷迁移/
  // 零数据搬移，换名重部署引用同一物理卷）。
  rpc MoveDatabase(MoveDatabaseRequest) returns (MoveDatabaseResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{to_project_id}:move-database"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // AttachAppProjectNetwork 把 app 挂入其项目网（T 线 OT-1 / IMPL-T15-1 的
  // 显式 opt-in；项目由 app 行归属解析——请求不携带项目，避免「指向别的
  // 项目网」的歧义面）。语义（全部幂等）：
  //   1. 确保项目网 overlay 在位（平台建 `fleetly-project-<project_id>`，
  //      带自描述 label；缺失创建、已存在不覆盖）；
  //   2. 参与位置位（状态库唯一改变路径；审计 app.project_network_attached
  //      + 事件 project.network_changed 同事务）；
  //   3. 入队「参与变更重部署」（复用最近 succeeded 部署的 compose——新
  //      revision 的成员服务双挂项目网，滚动收敛；无部署史 = 仅置位）。
  // 权限：admin scope + 项目角色 admin（网络姿态改变是隔离面的敏感写，
  // 与 app 删除/secrets 同级；平台管理员只读不代写）。在途部署存在时 409
  // 拒绝（重部署会以旧快照覆盖在途发布）。
  rpc AttachAppProjectNetwork(AttachAppProjectNetworkRequest) returns (AttachAppProjectNetworkResponse) {
    option (google.api.http) = { post: "/v1/apps/{app}/project-network" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // DetachAppProjectNetwork 从项目网摘除 app（摘网随下一次重部署的服务
  // 滚动收敛；项目网在失去最后一名成员且零端点后由平台回收）。权限与
  // 在途守卫同 Attach。
  rpc DetachAppProjectNetwork(DetachAppProjectNetworkRequest) returns (DetachAppProjectNetworkResponse) {
    option (google.api.http) = { delete: "/v1/apps/{app}/project-network" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
}

// ProjectView 是项目行的无敏感投影。
message ProjectView {
  string id = 1;
  string team_id = 2;
  // 归属团队 slug（限定形 team/project 展示面，D-W0-9）。
  string team_slug = 3;
  // 单词制标识（[a-z0-9]{2,32}、team 内唯一、不可变；命名公式三段第二位）。
  string slug = 4;
  string name = 5;
  string description = 6;
  google.protobuf.Timestamp created_at = 7;
  // 项目网投影（IMPL-T15-1/OT-1）：network_name = 项目网 overlay 名
  //（`fleetly-project-<id>`，平台建；无成员时对象可不存在）；network_members
  // = 参与位在位的 active app 数（成员计数，Console 网络面展示）。
  string network_name = 8;
  int32 network_members = 9;
}

message CreateProjectRequest {
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
  string slug = 2 [(buf.validate.field).string = {
    min_len: 2,
    max_len: 32,
    pattern: "^[a-z0-9]{2,32}$"
  }];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 100
  }];
  string description = 4 [(buf.validate.field).string.max_len = 500];
}

message CreateProjectResponse {
  ProjectView project = 1;
}

message ListProjectsRequest {
  // 可选：收窄到单队（空 = 我可见全部——跨我所在团队；平台管理员 = 全部）。
  string team_id = 1;
}

message ListProjectsResponse {
  repeated ProjectView projects = 1;
}

message GetProjectRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetProjectResponse {
  ProjectView project = 1;
}

message UpdateProjectRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 100
  }];
  string description = 3 [(buf.validate.field).string.max_len = 500];
}

message UpdateProjectResponse {
  ProjectView project = 1;
}

message DeleteProjectRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteProjectResponse {}

message ListProjectMembersRequest {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ProjectMemberView {
  string project_id = 1;
  string user_id = 2;
  // 覆写角色（admin/developer/viewer 三档；owner 不可覆写——设计 §3.3）。
  string role = 3;
  google.protobuf.Timestamp created_at = 4;
  // 属主投影（成员列表的可用性面；无敏感材料）。
  string email = 5;
  string display_name = 6;
}

message ListProjectMembersResponse {
  repeated ProjectMemberView members = 1;
}

message SetProjectMemberRoleRequest {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string user_id = 2 [(buf.validate.field).string.min_len = 1];
  string role = 3 [(buf.validate.field).string = {
    in: ["admin", "developer", "viewer"]
  }];
}

message SetProjectMemberRoleResponse {
  ProjectMemberView member = 1;
}

message RemoveProjectMemberRequest {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string user_id = 2 [(buf.validate.field).string.min_len = 1];
}

message RemoveProjectMemberResponse {}

// MoveAppRequest 是资源改派请求（平台管理员专属）。
message MoveAppRequest {
  // app 引用：裸名（解析域内唯一）、`team/prj/app` 限定形或平台 ID。
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // 目标项目平台 ID（管理面用 ID，D-W0-9——免疫同名项目歧义）。
  string to_project_id = 2 [(buf.validate.field).string.min_len = 1];
}

// MoveAppResponse 是改派应答：换名重部署的结论投影（swapped = 新命名服务
// 已就位并摘除旧名服务；accepted = 无运行中服务，仅归属切换）。
message MoveAppResponse {
  string app = 1;
  string from_project_id = 2;
  string to_project_id = 3;
  string to_project = 4;
  // 换名重部署的部署 ID（无部署史 = 空）。
  string deployment_id = 5;
  // moved|accepted（accepted = 无底座对象随迁的纯归属切换）。
  string status = 6;
}

// MoveDatabaseRequest 是库实例改派请求（平台管理员专属）。
message MoveDatabaseRequest {
  // 库实例引用：裸名（解析域内唯一）、`team/prj/<name>` 限定形或平台 ID。
  string database = 1 [(buf.validate.field).string.min_len = 1];
  // 目标项目平台 ID。
  string to_project_id = 2 [(buf.validate.field).string.min_len = 1];
}

// MoveDatabaseResponse 是库改派应答。
message MoveDatabaseResponse {
  string database = 1;
  string from_project_id = 2;
  string to_project_id = 3;
  string to_project = 4;
  string status = 5;
}

// AttachAppProjectNetworkRequest 是项目网挂入请求（app 引用：裸名解析域内
// 唯一 / `team/prj/app` 限定形 / 平台 ID；项目由 app 行归属解析）。
message AttachAppProjectNetworkRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
}

// DetachAppProjectNetworkRequest 是项目网摘除请求（app 引用同 Attach）。
message DetachAppProjectNetworkRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
}

// AttachAppProjectNetworkResponse 是挂入应答（两条 RPC 共享同一
// membership 投影——buf lint 要求 response 名与 RPC 同名，投影复用）。
message AttachAppProjectNetworkResponse {
  AppProjectNetworkMembership membership = 1;
}

// DetachAppProjectNetworkResponse 是摘除应答。
message DetachAppProjectNetworkResponse {
  AppProjectNetworkMembership membership = 1;
}

// AppProjectNetworkMembership 是参与变更的结论投影。
message AppProjectNetworkMembership {
  string app_id = 1;
  string app = 2;
  string project_id = 3;
  // 项目限定形展示（team/project）。
  string project = 4;
  // 项目网 overlay 名（`fleetly-project-<project_id>`）。
  string network = 5;
  // 变更后的参与状态（true = 已挂入）。
  bool attached = 6;
  // 本次是否发生状态变更（false = 已是目标值，幂等重跑；后置编排仍执行）。
  bool changed = 7;
  // 参与变更重部署的部署 ID（无成功部署史 = 空）。
  string deployment_id = 8;
  // rolling | attached | detached（rolling = 重部署已入队，服务随发布
  // 滚动切换网络；attached/detached = 无部署史，仅状态落位）。
  string status = 9;
}
