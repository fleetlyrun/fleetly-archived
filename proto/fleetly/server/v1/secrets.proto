syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// SecretsService 是平台密钥库资源面（E4 managed-databases §2.7/§5.1，D-DB-7）：
// app 级 external secret 的唯一写入口（compose secrets 顶层声明的来源）。
//
// **无值读回 RPC**（D-DB-7 终裁：忘记即轮换——比 env GetEnv 的 admin 明文
// 路径更严一档，secret 是更敏感类；hash8 供「是不是那个值」引用比对）。
// 轮换 = 同名 SetSecret 覆盖（换 hash8 换 Swarm secret 名换引用——值变化
// 随下次部署生效）。
//
// 错误语义：
//   app 不存在     → 404（apps 面同款退化信封）
//   secret 不存在  → 404（remove；幂等不做——与 RemoveEnv 同口径）
//   值超长/名违规  → 400（buf.validate 形状层；handler 层同名规则兜底）
service SecretsService {
  // SetSecret 写入（覆盖即轮换）：值经 age envelope 加密落 app_secrets；
  // 审计 secret.set（diff 只带名称与 hash8 指纹——值零出现）。
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse) {
    option (google.api.http) = {
      post: "/v1/apps/{app}/secrets"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // ListSecrets 该 app 全部 secret（按 name 字典序；只投影名称/指纹/时间锚
  // ——值与密文零出现）。
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/secrets" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // RemoveSecret 删除单条（幂等不做：不存在 404；审计 secret.removed）。
  // 已被运行中服务引用的 removal 不追写部署——引用方下次部署 preflight
  // E_SECRET_NOT_FOUND 诚实失败（移除声明再部署的既有语义）。
  rpc RemoveSecret(RemoveSecretRequest) returns (RemoveSecretResponse) {
    option (google.api.http) = { delete: "/v1/apps/{app}/secrets/{name}" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
}

message SetSecretRequest {
  // 归属 app 名。
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // secret 声明名（compose 服务级 secrets 引用的短名；合法 /run/secrets/<name>
  // 文件名字符集 ^[A-Za-z0-9][A-Za-z0-9._-]*$——与 internal/compose 的
  // secret 名校验同规则，注释锚互指）。
  string name = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*$"];
  // 值（明文；age 加密在服务端。上限 64KiB sanity——Swarm secret 单对象
  // 上界 500KB 的宽松内档；长度进形状层即拒，不落日志）。
  string value = 3 [(buf.validate.field).string = { min_len: 1, max_len: 65536 }];
}

message SetSecretResponse {
  string app = 1;
  string name = 2;
  // 值指纹（sha256 前 8 hex——「是不是那个值」比对面；值材料零出现）。
  string hash8 = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListSecretsRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
}

message ListSecretsResponse {
  repeated SecretView secrets = 1;
}

message RemoveSecretRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
}

message RemoveSecretResponse {
  string app = 1;
  string name = 2;
}

// SecretView 是平台密钥库条目的只读投影（值/密文/明文零出现——D-DB-7
// 无值读回；hash8 是唯一的值比对面）。
message SecretView {
  string name = 1;
  string hash8 = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}
