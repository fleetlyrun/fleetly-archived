syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// EnvService 是平台层环境变量面（T2.17；三层合并链的平台层）。生效语义：
// Set/Remove 都把行置 pending——「随下次部署生效」，pending 语义经 status
// 字段透出（console 可见「待生效」）；合并链消费全量行（pending 与
// effective 都参与合并——部署是 pending 的消费点，部署成功后统一提升为
// effective，S16-C4 契约统一）。
//
// 取舍注记（T2.17 设计裁决）：GetEnv 返回**明文**，需要 admin scope（与
// CLI `fleetly env get` 同级敏感操作，鉴权矩阵在拦截器链强制）；List 恒
// 不出值（键名/来源/状态位）。
service EnvService {
  rpc SetEnv(SetEnvRequest) returns (SetEnvResponse) {
    option (google.api.http) = {
      put: "/v1/apps/{app}/env/{key}"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
  rpc GetEnv(GetEnvRequest) returns (GetEnvResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/env/{key}" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc ListEnv(ListEnvRequest) returns (ListEnvResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/env" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc RemoveEnv(RemoveEnvRequest) returns (RemoveEnvResponse) {
    option (google.api.http) = { delete: "/v1/apps/{app}/env/{key}" };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
}

message SetEnvRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
  // 明文入参；服务端 envelope 加密落库（值不进审计/事件/日志）。
  string value = 3 [(buf.validate.field).string.min_len = 1];
}

message SetEnvResponse {
  string app = 1;
  string key = 2;
  // 恒 "pending"（随下次部署生效）。
  string status = 3;
}

message GetEnvRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
}

message GetEnvResponse {
  string app = 1;
  string key = 2;
  // 明文（admin scope 专用路径）。
  string value = 3;
  // pending | effective。
  string status = 4;
}

message ListEnvRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
}

// EnvVarView 是 env 行的无值投影（值恒脱敏——读值走 GetEnv 显式路径）。
message EnvVarView {
  string key = 1;
  // platform | system。
  string source = 2;
  // pending | effective。
  string status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListEnvResponse {
  repeated EnvVarView env_vars = 1;
}

message RemoveEnvRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
}

message RemoveEnvResponse {
  string app = 1;
  string key = 2;
  // 平台层台账立即删行；运行实例的 env 快照随下次部署更新（与 pending
  // 同链路语义，取值恒 "pending"——移除不是即时生效面）。
  string status = 3;
}
