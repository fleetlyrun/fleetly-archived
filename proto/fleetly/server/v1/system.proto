syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合——不用生成器默认的
// rpcStatus，信封单一事实源在 fleetly.shared.v1.ErrorResponse）。鉴权
// securityDefinitions 随拦截器链鉴权（D21）落地时补声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// SystemService 承载控制面进程级系统信息。T0.3 的契约验证面：同一 proto
// 同时生成 gRPC client（SDK 与 CLI）与 REST 端点（gateway），双面同源。
// T2.17 起扩容 GetSystemStatus（引擎/Traefik/状态层健康汇总——复用 lynx
// CheckHealth 面：逐 checker 如实上报，不聚合出单一布尔，判断权在消费方）。
// T2.18 起扩容集群级观察面：ListNodes（节点观测缓存只读列表——无 app 归
// 属的控制面/集群级诊断，与状态汇总同层）与 GetIngressStatus（入口链三面
// 状态：Traefik 服务实况 + 配置端点健康 + 证书台账对照——探测在服务端
// 执行，CLI 不再直连 docker/读本地 token 文件）。
service SystemService {
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = { get: "/v1/system/ping" };
  }
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse) {
    option (google.api.http) = { get: "/v1/system/status" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option (google.api.http) = { get: "/v1/system/nodes" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc GetIngressStatus(GetIngressStatusRequest) returns (GetIngressStatusResponse) {
    option (google.api.http) = { get: "/v1/system/ingress" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // ListBackups 状态备份台账（T2.22，只读）：热备快照的诚实账（kind/路径/
  // sha256/verify_status）。verify_status=failed 的行是红色告警面的一部分
  // ——台账如实保留失败行，消费方据此判断备份可用性。
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option (google.api.http) = { get: "/v1/system/backups" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // TriggerBackup 手动触发一次状态备份（T2.22；deploy scope——写面语义，
  // 与升级编排 pre_upgrade 快照共用同一同步入口；响应即落账后的台账行，
  // verify_status=failed 时调用方必须视为备份失败而非请求失败歧义态）。
  rpc TriggerBackup(TriggerBackupRequest) returns (TriggerBackupResponse) {
    option (google.api.http) = {
      post: "/v1/system/backups"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
  // GetJoinGuide join 向导（E1-8，multi-node §2.3/D-MN-13；admin scope
  // ——响应含 join token 材料）。base_domain 为空 → E_MULTI_NODE_REQUIRES_
  // BASE_DOMAIN（409，D-MN-13：多节点未启用显式拒绝）。服务端生成 join
  // 命令、按 worker_ip 的精确防火墙放行规则（只生成不自动应用）、DNS
  // 步骤与完成判据；防火墙规则文本附「--harden-firewall 自动应用维持
  // reserved」口径（平台不静默改用户防火墙）。
  rpc GetJoinGuide(GetJoinGuideRequest) returns (GetJoinGuideResponse) {
    option (google.api.http) = { get: "/v1/system/nodes/join-guide" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // RotateJoinToken 轮换 swarm join token（E1-8，D-MN-1：锚定完成后自动
  // rotate 把泄露窗口收敛到分钟级；批量场景 manual 后手动执行）。role
  // 缺省 worker；rotate 后旧 token 立即失效。经底座 swarm 面执行，轮换
  // 记审计（node.join_token_rotated，§5.3——审计不设事件）。
  rpc RotateJoinToken(RotateJoinTokenRequest) returns (RotateJoinTokenResponse) {
    option (google.api.http) = {
      post: "/v1/system/nodes/join-token:rotate"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // GetS3Settings 对象存储设置只读面（E3 对象存储 §5.1/E3-2；admin scope
  // ——端点/桶/凭证指纹属平台敏感配置）。secret 只回 fingerprint（sha256
  // 前 8），绝不回明文；s3.mode=unset 时其余字段为空。
  rpc GetS3Settings(GetS3SettingsRequest) returns (GetS3SettingsResponse) {
    option (google.api.http) = { get: "/v1/system/s3" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // UpdateS3Settings 全量保存对象存储设置（PUT 语义：请求即新状态，空字段
  // 即清空——避免「改 mode 残留旧凭证」的静默状态；secret_access_key 为
  // 明文字段，只写不读，传输面 TLS 承载机密性，持久层 envelope 加密）。
  // 互斥校验 fail-fast：mode=external 必填四项；mode=rustfs 四项必须为空；
  // public_exposed=true 仅 rustfs 且需 base_domain（E_S3_PUBLIC_REQUIRES_
  // BASE_DOMAIN）。保存落审计 + 事件 s3.updated（payload 带模式不带走秘密）。
  rpc UpdateS3Settings(UpdateS3SettingsRequest) returns (UpdateS3SettingsResponse) {
    option (google.api.http) = {
      put: "/v1/system/s3"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // TestS3Connection S3 连接探针（E3 对象存储 §2.1 诚实契约：put→get→
  // delete 一枚探针对象并逐字节比对——通过 = 能认证/能写/能读回，不是 TCP
  // 探活）。可带候选配置（未保存也能测）；全部候选字段为空 = 测已存配置。
  // 探针失败以 E_S3_TEST_FAILED 报错，失败步与底层错误摘要进信封 context。
  rpc TestS3Connection(TestS3ConnectionRequest) returns (TestS3ConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/system/s3:test"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // GetAcmeSettings ACME DNS-01 设置只读面（B 线 W5 设计 §3，D-V3W5-3/4；
  // admin scope——DNS 服务商凭据指纹属平台敏感配置，与 S3 设置同门）。
  // 凭证只回 fingerprint（sha256 前 8），绝不回明文；同时下发服务端派生的
  // 通配期望域名集（wildcard=true 时非空）——CLI/Console 展示当前证书
  // 域名集形态，派生公式与签发面同源（服务端单点）。
  rpc GetAcmeSettings(GetAcmeSettingsRequest) returns (GetAcmeSettingsResponse) {
    option (google.api.http) = { get: "/v1/system/acme" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // UpdateAcmeSettings 保存 ACME DNS-01 设置（provider + 凭证 + wildcard
  // 开关）。api_token 为明文只写字段（TLS 传输面承载机密性，持久层
  // envelope 加密）：**留空 = 保留已存凭证**（SMTP 密码同款先例——wildcard
  // 开关切换不要求重录凭证）；dns_provider=none 恒清空凭证。联动校验
  // fail-fast：wildcard=true 须 provider ∈ {dnspod, cloudflare}（422
  // E_ACME_WILDCARD_REQUIRES_PROVIDER——通配 SAN 只能 DNS-01 验证）且须
  // base_domain（409 E_ACME_WILDCARD_REQUIRES_BASE_DOMAIN）。保存落审计
  // acme.settings_changed（provider/wildcard/凭证有无——零明文；本设置族
  // 零事件，审计承载）。
  rpc UpdateAcmeSettings(UpdateAcmeSettingsRequest) returns (UpdateAcmeSettingsResponse) {
    option (google.api.http) = {
      put: "/v1/system/acme"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // TestDnsProvider DNS 服务商探针（诚实契约：在 _acme-challenge-test.
  // <base_domain> 建 TXT → 删 TXT 两步真实往返——通过 = 能认证/能写/能删，
  // zone 解析在 create 步隐含执行；不是"能列域名"级别的浅探测）。可带候选
  // 凭证（未保存也能测）；两字段全空 = 测已存凭证。探针失败以
  // E_ACME_DNS_TEST_FAILED 报错，失败步与底层 provider 错误摘要进信封
  // context（凭证材料零出现）。
  rpc TestDnsProvider(TestDnsProviderRequest) returns (TestDnsProviderResponse) {
    option (google.api.http) = {
      post: "/v1/system/acme/dns:test"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // GetRegistrySettings 平台 registry 凭证设置只读面（IMPL-T1-2/DT-2；
  // admin scope——registry host/用户名/密码指纹属平台敏感配置，与 S3/ACME
  // 设置同门）。密码只回 fingerprint（sha256 前 8），绝不回明文；未配置
  // 时 host 为空。
  rpc GetRegistrySettings(GetRegistrySettingsRequest) returns (GetRegistrySettingsResponse) {
    option (google.api.http) = { get: "/v1/system/registry" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // UpdateRegistrySettings 保存平台 registry 凭证设置（host + 用户名 +
  // 密码）。语义：host 空 = 清除全部设置；password 留空 = 保留已存密码
  //（ACME api_token 同款先例——改主机/用户名不强制重录）。保存落审计
  // registry.updated + 事件 registry.updated（payload 带 host 与指纹，
  // 凭据材料零出现）。解析失败时部署路径回落本机 inspect（airgap 不回归）。
  rpc UpdateRegistrySettings(UpdateRegistrySettingsRequest) returns (UpdateRegistrySettingsResponse) {
    option (google.api.http) = {
      put: "/v1/system/registry"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
}

message PingRequest {}

message PingResponse {
  // 应答服务名（恒 "fleetlyd"）。
  string service = 1 [(buf.validate.field).string.min_len = 1];
  // 服务版本（构建 -ldflags 注入，未注入时为 "dev"）。
  string version = 2 [(buf.validate.field).string.min_len = 1];
}

message GetSystemStatusRequest {}

// ComponentHealth 是单组件健康如实上报（name = lynx 服务名，如
// state.store / state.observer / ingress.traefik）。ok=false 时 error 为
// 检查器返回原文。
message ComponentHealth {
  string name = 1;
  bool ok = 2;
  string error = 3;
}

message GetSystemStatusResponse {
  string service = 1;
  string version = 2;
  repeated ComponentHealth components = 3;
  // 状态备份健康视图（T2.22）：最近一次台账行的投影。从未备份 → 不输出
  //（backup 组件的 ComponentHealth 行会以 ok=false 显式表达不健康）。
  BackupHealth backup = 4;
  // 5 曾为 git_ssh_fingerprint（git SSH host key 指纹披露；git push 部署
  // 面 2026-09-29 移除，ADR-0012 裁决砍 SSH 收包半）。
  reserved 5;
  reserved "git_ssh_fingerprint";
}

// BackupHealth 是系统状态里备份面的明细视图（组件布尔健康的展开：最近
// 一次备份的时间与校验结论——「绿色成功但实际没备份」的对立面是让
// verify_status 与时间直接可见）。
message BackupHealth {
  // 最近一次备份的台账 ID（= 备份目录名）。
  string last_backup_id = 1;
  // 最近一次备份的触发类别（daily/pre_upgrade/post_deploy/manual）。
  string last_kind = 2;
  // 最近一次备份的台账落账时刻。
  google.protobuf.Timestamp last_backup_at = 3;
  // 回读校验结论（verified/failed）。
  string last_verify_status = 4;
  // 失败原因原文（verified 行为空）。
  string last_error = 5;
}

message ListNodesRequest {}

// NodeView 是节点观测缓存行的只读投影（state-model §2.2：缓存禁止用于
// 决策，展示/诊断专用；节点变更用 docker node 原生命令）。观测数据带
// observed_at/stale——状态诚实契约（architecture §4.2 横切硬指标）；
// nodes 不提供「最后心跳」字段。
message NodeView {
  string swarm_node_id = 1;
  // 平台节点 ID（fleetly.placement.node-id label；未锚定时为空）。
  string platform_id = 2;
  string hostname = 3;
  string state = 4;
  string availability = 5;
  bool is_manager = 6;
  google.protobuf.Timestamp observed_at = 7;
  bool stale = 8;
  map<string, string> labels = 9;
  // 绑定其上的应用 ID 清单（E1-8，multi-node §2.7/D-MN-9：读时 join
  // placements 权威表，无迁移——UI「已钉应用」交叉引用面）。
  repeated string pinned_app_ids = 10;
}

message ListNodesResponse {
  repeated NodeView nodes = 1;
}

message GetJoinGuideRequest {
  // worker 节点的公网 IP（防火墙规则按它生成精确放行文本；空 = 输出
  // 规则模板、IP 位以 <worker-ip> 占位）。
  string worker_ip = 1;
  // manager 可达地址覆盖（advertise 为私网而 worker 跨公网的场景；空 =
  // 取 swarm advertise addr）。
  string manager_addr = 2;
}

// FirewallRule 是一条防火墙放行规则文本（方向 + 端口/协议 + 用途 + 可
// 复制命令；只生成不自动应用——平台不静默改用户防火墙，multi-node §2.3）。
message FirewallRule {
  // 方向词表：worker_to_manager / bidirectional / public_to_all。
  string direction = 1;
  // 端口/协议（如 2377/tcp、7946/tcp+udp、4789/udp、8423/tcp、80,443/tcp）。
  string port = 2;
  // 用途（集群管理 / gossip / overlay VXLAN / Traefik 配置端点 TLS / 应用入口）。
  string purpose = 3;
  // 规则文本（manager 侧或 worker 侧可复制的 iptables 命令/说明）。
  string rule = 4;
  // 规则应用在哪一侧（manager / worker / both）。
  string side = 5;
}

// JoinGuideView 是 join 向导输出（服务端生成，multi-node §2.3）。
message JoinGuideView {
  // 完整 join 命令（docker swarm join --token SWMTKN-… <manager-addr>:2377）。
  string join_command = 1;
  // manager 可达地址（swarm advertise addr 或请求覆盖值）。
  string manager_addr = 2;
  // worker join token（admin scope 的 token 材料；向导后按 join.token_
  // rotate=auto 自动轮换的口径见 D-MN-1）。
  string worker_token = 3;
  // 平台域名（DNS 步骤的主体）。
  string base_domain = 4;
  // manager 侧放行规则（按 worker_ip 生成）。
  repeated FirewallRule manager_firewall_rules = 5;
  // worker 侧放行规则。
  repeated FirewallRule worker_firewall_rules = 6;
  // worker 前置门禁命令（docker version ≥29.8.1 + iptables legacy 判定
  // ——与 install.sh 同判据的命令形态；复制到 worker 执行）。
  repeated string worker_preflight_commands = 7;
  // DNS 步骤（既有应用/平台子域 A 记录追加 worker IP；ctrl.<base> 保持
  // 仅 manager；fleetly domains verify 复核）。
  repeated string dns_steps = 8;
  // 完成判据（向导自动推进面：节点观测拍出现 → 锚定 node.joined →
  // ready + Traefik 任务 running）。
  repeated string completion_checks = 9;
}

message GetJoinGuideResponse {
  JoinGuideView guide = 1;
}

message RotateJoinTokenRequest {
  // 轮换目标 token 的角色：worker（缺省）| manager。
  string role = 1 [(buf.validate.field).string = {
    in: [
      "",
      "worker",
      "manager"
    ]
  }];
}

message RotateJoinTokenResponse {
  // 轮换后的角色与新 token（旧 token 立即失效；admin scope 材料）。
  string role = 1;
  string token = 2;
}

message GetIngressStatusRequest {}

// TraefikView 是入口服务实况投影（Swarm service inspect；不可达时 exists
// = false 且 error 为探测原文）。
message TraefikView {
  bool exists = 1;
  string image = 2;
  int32 static_args = 3;
  string error = 4;
}

// CertLedgerView 是证书台账行投影（domains 表 cert 列对照；app 为显示名，
// 已删除应用回退显示 app id）。
message CertLedgerView {
  string app = 1;
  string domain = 2;
  string cert_sha256 = 3;
  google.protobuf.Timestamp cert_not_after = 4;
}

message GetIngressStatusResponse {
  TraefikView traefik = 1;
  // 控制面配置端点监听地址（ingress.config_addr 配置原值）。
  string config_addr = 2;
  // 下发给 Traefik 的控制面可达 IP（空 = 自动探测）。
  string advertise_ip = 3;
  // ACME challenge 应答器基址（空 = 未接入集中签发）。
  string responder = 4;
  // 配置端点两面探测结果（服务端环回执行）：/healthz 无鉴权状态行；
  // /configs 带 token 鉴权核验（401 = token 缺失/错误，如实报告；200 =
  // 鉴权通过且返回合法 JSON）。不可达 = "unreachable"。
  string healthz = 5;
  string auth = 6;
  // 证书台账（有证书的域名行）。
  repeated CertLedgerView certificates = 7;
  // 证书存储目录（控制面侧）与其中的 app 清单（meta 索引；目录缺失 =
  // 空清单非错误，cert_dir_error 承载读取故障原文）。
  string cert_dir = 8;
  repeated string cert_dir_apps = 9;
  string cert_dir_error = 10;
}

message ListBackupsRequest {}

// BackupView 是状态备份台账行的只读投影（state_backups 表）。path 指向
// 备份目录内的快照文件；manifest.json 与其同目录（含 sha256/密钥指纹/
// schema 版本——恢复核对材料，密钥本体绝不入备份目录）。
message BackupView {
  string id = 1;
  // 触发类别：daily / pre_upgrade / post_deploy / manual（历史行可为
  // hot/cold）。
  string kind = 2;
  // 快照文件路径。
  string path = 3;
  // 快照文件 sha256（hex；回读校验对象）。
  string sha256 = 4;
  int64 size_bytes = 5;
  // 回读校验结论：verified / failed（失败行保留——红色告警面的一部分）。
  string verify_status = 6;
  // 校验失败原因原文（verified 行为空）。
  string error = 7;
  // 台账落账时刻。
  google.protobuf.Timestamp created_at = 8;
  // 远端上传结论（E3-3 上传轨）：none（未上传——s3.mode=unset 合法态或
  // 上传步未执行）/ ok / failed。本地 verify 语义不变（上传失败不回写
  // verify_status）。
  string upload_status = 9;
  // 最近一次上传尝试的完成时刻（ok/failed 都记；从未尝试不输出）。
  google.protobuf.Timestamp uploaded_at = 10;
  // 上传失败原因摘要（截断上界在存储层；不含 secret——restic env 凭证
  // 材料禁止进台账/事件/读面）。
  string upload_error = 11;
}

message ListBackupsResponse {
  repeated BackupView backups = 1;
}

message TriggerBackupRequest {
  // 触发类别（缺省 manual；升级编排传 pre_upgrade）。manual/daily/
  // pre_upgrade/post_deploy 之外取值被请求校验拒绝。
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "",
      "manual",
      "daily",
      "pre_upgrade",
      "post_deploy"
    ]
  }];
}

message TriggerBackupResponse {
  BackupView backup = 1;
}

// ── 对象存储 S3 设置面（E3 对象存储 §5.1/E3-2，2026-09-21 裁决轮落定）──

message GetS3SettingsRequest {}

// S3SettingsView 是 s3.* 设置的只读投影。secret 只回 fingerprint（明文
// sha256 前 8 hex；空 = 未设置）——读面永无明文（写面 UpdateS3Settings
// 承载 secret 明文，TLS 传输面 + envelope 持久层）。
message S3SettingsView {
  // 模式词表：unset（缺省，未配置）| external（外部 S3 端点）| rustfs
  //（托管 RustFS，opt-in）。
  string mode = 1;
  // S3 端点 URL（含 scheme，如 https://s3.amazonaws.com；rustfs 模式下
  // 服务端派生 http://rustfs:9000）。
  string endpoint_url = 2;
  string region = 3;
  string bucket = 4;
  string access_key_id = 5;
  // secret 指纹（sha256 前 8 hex），非 secret 本体。
  string secret_fingerprint = 6;
  // path-style 寻址（RustFS/MinIO 类自建端点 true，AWS 虚拟主机式 false）。
  bool path_style = 7;
  // 公网子域开关（仅 rustfs 模式可开；开启后 s3.<base> 公网可达）。
  bool public_exposed = 8;
  // 最近一次保存时刻（从未保存 → 不输出）。
  google.protobuf.Timestamp updated_at = 9;
  // 公网访问域名的服务端派生实值（v0.2.x 收尾票：CLI 公网行字面 s3.<base>
  // 的收口——读面此前不含 base_domain，CLI 只能显示字面形态）。派生公式
  // = "s3." + base_domain；仅 public_exposed=true 且 base_domain 非空时填
  // 充，其余形态为空串（读面永不含凭据材料）。
  string public_domain = 10;
}

message GetS3SettingsResponse {
  S3SettingsView settings = 1;
}

message UpdateS3SettingsRequest {
  // 模式词表（空 = unset）。external↔rustfs 互斥校验见 rpc 注记。
  string mode = 1 [(buf.validate.field).string = {
    in: [
      "",
      "unset",
      "external",
      "rustfs"
    ]
  }];
  string endpoint_url = 2;
  string region = 3;
  string bucket = 4;
  string access_key_id = 5;
  // secret 明文（只写字段；读面只见 fingerprint）。PUT 语义：留空 = 无
  // secret（切换到 rustfs/unset 时随全量覆写自然清空外部凭证）。
  string secret_access_key = 6;
  bool path_style = 7;
  bool public_exposed = 8;
}

message UpdateS3SettingsResponse {
  // 保存后的设置投影（与 GetS3Settings 同一脱敏读面）。
  S3SettingsView settings = 1;
}

message TestS3ConnectionRequest {
  // 候选配置（未保存也能测）：任一字段非零即视为候选配置；全空 = 测已存
  // 配置（s3.mode=unset 时已存配置不存在，拒绝）。
  string endpoint_url = 1;
  string region = 2;
  string bucket = 3;
  string access_key_id = 4;
  string secret_access_key = 5;
  bool path_style = 6;
}

// S3ProbeStep 是探针单步结果（put/get/delete；诚实契约：失败步可定位）。
message S3ProbeStep {
  // 步骤名：put | get | delete。
  string step = 1;
  bool ok = 2;
  // 该步耗时（毫秒）。
  int64 duration_ms = 3;
  // 失败时的底层错误摘要（不含 secret 材料）。
  string error = 4;
}

// S3ConnectionTestResult 是探针结构化结果：endpoint 回显脱敏（secret 不
// 回显）、各步耗时、失败步。ok=false 时 failed_step 指向首个失败步。
message S3ConnectionTestResult {
  bool ok = 1;
  string endpoint_url = 2;
  string region = 3;
  string bucket = 4;
  bool path_style = 5;
  repeated S3ProbeStep steps = 6;
  string failed_step = 7;
}

message TestS3ConnectionResponse {
  S3ConnectionTestResult result = 1;
}

// ── ACME DNS-01 通配证书面（B 线 W5 设计 §3，D-V3W5-3/D-V3W5-4，W5-S3）──

message GetAcmeSettingsRequest {}

// AcmeSettingsView 是 acme.* 设置的只读投影。凭证只回 fingerprint（明文
// sha256 前 8 hex；空 = 未设置）——读面永无明文（写面 UpdateAcmeSettings
// 承载明文，TLS 传输面 + envelope 持久层）。
message AcmeSettingsView {
  // DNS-01 服务商词表：none（缺省，未配置）| dnspod | cloudflare。
  string dns_provider = 1;
  // 凭证指纹（sha256 前 8 hex），非凭证本体；空 = 未设置。
  string credentials_fingerprint = 2;
  // 通配证书 opt-in 开关（true 时平台证书签
  // [*.base, console/ctrl/registry.<base>]，DNS-01 验证）。
  bool wildcard = 3;
  // 最近一次保存时刻（从未保存 → 不输出）。
  google.protobuf.Timestamp updated_at = 4;
  // 通配期望域名集的服务端派生实值（wildcard=true 且 base_domain 非空时
  // 非空；派生公式与签发面同源）。CLI/Console 的「当前证书域集」展示源。
  repeated string wildcard_domains = 5;
  // 平台域名（空 = 单节点形态——通配/平台证书面均不可用）。
  string base_domain = 6;
}

message GetAcmeSettingsResponse {
  AcmeSettingsView settings = 1;
}

message UpdateAcmeSettingsRequest {
  // 服务商词表（空 = none）。联动校验见 rpc 注记。
  string dns_provider = 1 [(buf.validate.field).string = {
    in: [
      "",
      "none",
      "dnspod",
      "cloudflare"
    ]
  }];
  // 凭证明文（只写字段；读面只见 fingerprint）。**留空 = 保留已存凭证**
  //（SMTP 密码同款先例——wildcard 开关切换不要求重录）；dns_provider=none
  // 时恒清空。dnspod 形态 "<id>,<token>"；cloudflare 为单 token。
  string api_token = 2;
  // 通配证书 opt-in 开关。
  bool wildcard = 3;
}

message UpdateAcmeSettingsResponse {
  // 保存后的设置投影（与 GetAcmeSettings 同一脱敏读面）。
  AcmeSettingsView settings = 1;
}

message TestDnsProviderRequest {
  // 候选配置（未保存也能测）：任一字段非空即视为候选；两字段全空 = 测
  // 已存凭证（provider 未配置时拒绝）。
  string dns_provider = 1 [(buf.validate.field).string = {
    in: [
      "",
      "dnspod",
      "cloudflare"
    ]
  }];
  string api_token = 2;
}

// DnsProbeStep 是探针单步结果（create/delete；诚实契约：失败步可定位）。
message DnsProbeStep {
  // 步骤名：create | delete。
  string step = 1;
  bool ok = 2;
  // 该步耗时（毫秒）。
  int64 duration_ms = 3;
  // 失败时的底层 provider 错误摘要（不含凭证材料）。
  string error = 4;
}

// DnsProviderTestResult 是探针结构化结果：provider 回显、探针 TXT 名、
// 各步耗时、失败步。ok=false 时 failed_step 指向首个失败步（create 失败
// 短路——无记录可删，delete 不执行）。
message DnsProviderTestResult {
  bool ok = 1;
  string dns_provider = 2;
  // 探针 TXT 记录名（_acme-challenge-test.<base_domain>）。
  string record_name = 3;
  repeated DnsProbeStep steps = 4;
  string failed_step = 5;
}

message TestDnsProviderResponse {
  DnsProviderTestResult result = 1;
}

// ── 平台 registry 凭证面（IMPL-T1-2/DT-2，部署时镜像代拉的凭证下发）──

message GetRegistrySettingsRequest {}

// RegistrySettingsView 是 registry.* 设置的只读投影。密码只回 fingerprint
//（明文 sha256 前 8 hex；空 = 未设置）——读面永无明文（写面
// UpdateRegistrySettings 承载明文，TLS 传输面 + envelope 持久层）。
message RegistrySettingsView {
  // 外部 registry host（归一形态：小写、无 scheme；docker.io 家族归一为
  // registry-1.docker.io）。空 = 未配置（解析腿恒匿名）。
  string host = 1;
  string username = 2;
  // 密码指纹（sha256 前 8 hex），非密码本体；空 = 未设置密码。
  string password_fingerprint = 3;
  // 最近一次保存时刻（从未保存 → 不输出）。
  google.protobuf.Timestamp updated_at = 4;
}

message GetRegistrySettingsResponse {
  RegistrySettingsView settings = 1;
}

message UpdateRegistrySettingsRequest {
  // 外部 registry host（ghcr.io 形态；scheme 会被归一剥离）。空 = 清除
  // 全部设置（host/用户名/密码与指纹）。
  string host = 1;
  string username = 2;
  // 密码明文（只写字段；读面只见 fingerprint）。**留空 = 保留已存密码**
  //（ACME api_token 同款先例）；清除走 host 留空。
  string password = 3;
}

message UpdateRegistrySettingsResponse {
  // 保存后的设置投影（与 GetRegistrySettings 同一脱敏读面）。
  RegistrySettingsView settings = 1;
}
