syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// CronService 是定时任务面（E5 Cron，架构 §4.3 细则「入口：手动触发
// API/CLI/UI 走同一路径，写审计」+ object-storage 设计 §8 手动入口行）。
// 独立成 service 的理由：cron 触发是调度域的动作（与 deployments 的发布
// 状态机正交），runs 读面是调度台账的投影——并入 DeploymentsService 会把
// 两个留存模型混进一个资源面。
service CronService {
  // TriggerCronRun 手动触发一次（走与到点触发完全相同的链路：重叠 skip、
  // 绑定节点前哨、一次性 job 创建、cron_runs 行与事件；本路径追加审计
  // cron.manual_triggered）。重叠/节点不可用不报错——响应携带 skipped 行
  // 与原因（与调度器处置一致）。
  rpc TriggerCronRun(TriggerCronRunRequest) returns (TriggerCronRunResponse) {
    option (google.api.http) = {
      post: "/v1/apps/{app}/services/{service}/trigger"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
  // ListCronRuns 读运行台账（scheduled_at 倒序；service 空 = 该 app 全部
  // schedule 的行；保留窗每 schedule 最近 20 条，janitor 清理）。
  rpc ListCronRuns(ListCronRunsRequest) returns (ListCronRunsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/cron-runs" };
    option (fleetly.annotations.v1.scope) = "read";
  }
}

message TriggerCronRunRequest {
  // 应用名（compose 应用名）。
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // compose 服务名（必须声明 fleetly.cron，否则 404 语义）。
  string service = 2 [(buf.validate.field).string.min_len = 1];
}

message TriggerCronRunResponse {
  // 触发结果行（status=started 或 skipped；与到点触发同构）。
  CronRunView run = 1;
}

message ListCronRunsRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // 收窄到单 schedule（空 = 全部）。
  string service = 2;
  // 行数上限（缺省 20；≤20 的量级面，无分页游标）。
  int32 limit = 3 [(buf.validate.field).int32 = { gte: 0, lte: 100 }];
}

message ListCronRunsResponse {
  string app = 1;
  repeated CronRunView runs = 2;
}

// CronRunView 是一次 cron 触发的台账投影（状态词表 started | succeeded |
// failed | timeout | skipped；skipped 行带 skip_reason：
// overlap | node_unavailable | missed_downtime | interrupted）。
message CronRunView {
  string id = 1;
  string service = 2;
  string expression = 3;
  // 命中的 cron 点（手动触发 = 触发时刻）。
  google.protobuf.Timestamp scheduled_at = 4;
  // job 启动时刻（skipped 行不输出）。
  google.protobuf.Timestamp started_at = 5;
  // 终态收口时刻（在途/skipped 行不输出）。
  google.protobuf.Timestamp finished_at = 6;
  string status = 7;
  string skip_reason = 8;
  // 一次性 job 服务名（skipped 行不输出）。
  string job_service = 9;
  // 失败/超时原因摘要。
  string error = 10;
}
