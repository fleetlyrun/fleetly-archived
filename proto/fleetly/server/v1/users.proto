syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 tokens.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// UsersService 是平台用户管理面（RBAC 设计 §2.1/§3.2/§5，v0.3 W1）：
// 仅平台管理员可用（用户 principal 要求 is_platform_admin；user_id 为空的
// 机具令牌沿既有 admin scope 门——平台面判定在服务实现内强制，§4.2 第 3 条）。
//
// 临时口令语义：CreateUser / ResetUserPassword 的明文临时口令**仅本次响应**
// 可见（与 RevealDatabaseCredentials 同口径的 admin 面信任；v0.3 无 SMTP，
// 找回口令 = 平台管理员重置，设计 §2.1 诚实记录）。口令重置即全端下线
// （该用户全部会话同事务吊销——S1 遗留裁量在本票裁决落定）。
service UsersService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = { get: "/v1/users" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc DisableUser(DisableUserRequest) returns (DisableUserResponse) {
    option (google.api.http) = {
      post: "/v1/users/{id}/disable"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc EnableUser(EnableUserRequest) returns (EnableUserResponse) {
    option (google.api.http) = {
      post: "/v1/users/{id}/enable"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/users/{id}/password:reset"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc GrantPlatformAdmin(GrantPlatformAdminRequest) returns (GrantPlatformAdminResponse) {
    option (google.api.http) = {
      post: "/v1/users/{id}/platform-admin:grant"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc RevokePlatformAdmin(RevokePlatformAdminRequest) returns (RevokePlatformAdminResponse) {
    option (google.api.http) = {
      post: "/v1/users/{id}/platform-admin:revoke"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc SetRegistration(SetRegistrationRequest) returns (SetRegistrationResponse) {
    option (google.api.http) = {
      put: "/v1/auth/registration"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc GetAuditRetention(GetAuditRetentionRequest) returns (GetAuditRetentionResponse) {
    option (google.api.http) = { get: "/v1/audit/retention" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  rpc SetAuditRetention(SetAuditRetentionRequest) returns (SetAuditRetentionResponse) {
    option (google.api.http) = {
      put: "/v1/audit/retention"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
}

// UserView 是用户行的无敏感投影：口令哈希不存在于任何通道（state 层投影
// 纪律）；disabled_at 为空 = 在册。
message UserView {
  string id = 1;
  string email = 2;
  string display_name = 3;
  // 平台管理员标志（用户标志非角色，设计 §3.2）。
  bool is_platform_admin = 4;
  google.protobuf.Timestamp created_at = 5;
  // 已禁用时输出禁用时刻；在册时不输出。
  google.protobuf.Timestamp disabled_at = 6;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserView users = 1;
}

message CreateUserRequest {
  string email = 1 [(buf.validate.field).string = {
    min_len: 3,
    max_len: 254,
    email: true
  }];
  // 人读显示名（空 = 缺省取 email 本地部分，state 层落定）。
  string display_name = 2 [(buf.validate.field).string.max_len = 100];
}

message CreateUserResponse {
  UserView user = 1;
  // 明文临时口令，仅本次响应可见；首次登录后建议由用户自行修改（改口令
  // 自助面挂账设计 §12——v0.3 找回口令 = 平台管理员重置）。
  string temporary_password = 2;
}

message DisableUserRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DisableUserResponse {
  UserView user = 1;
}

message EnableUserRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message EnableUserResponse {
  UserView user = 1;
}

message ResetUserPasswordRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ResetUserPasswordResponse {
  string id = 1;
  // 明文临时口令，仅本次响应可见；旧口令立即失效，且该用户全部会话同
  // 事务吊销（重置即全端下线，设计 §2.1 本票裁决）。
  string temporary_password = 2;
}

message GrantPlatformAdminRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GrantPlatformAdminResponse {
  UserView user = 1;
}

message RevokePlatformAdminRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RevokePlatformAdminResponse {
  UserView user = 1;
}

message SetRegistrationRequest {
  // true = 开放自助注册；false = 关闭（平台管理员仍可经 CreateUser 加人）。
  bool open = 1;
}

message SetRegistrationResponse {
  bool open = 1;
}

message GetAuditRetentionRequest {}

// GetAuditRetentionResponse 是审计留存设置的只读投影（v0.3 W3-S3，rbac-teams
// §6 D-W0-6 收口——写面随本 RPC 族补齐，state 层 LoadAuditSettings W3-S1 已
// 备）。本层只诚实投影「未设置 / 显式设置」之别：set=false 时 days 不输出，
// 生效值回落链（config state.audit_retention_days > 缺省 90）由消费方裁决
// ——Console 显示缺省口径，不谎报设置存在。
message GetAuditRetentionResponse {
  // 显式设置的留存天数（set=false 时不输出）。
  int32 days = 1;
  // 该键是否被显式保存过（false = platform_settings 无行）。
  bool set = 2;
  // 设置行 updated_at（未设置时不输出）。
  google.protobuf.Timestamp updated_at = 3;
}

message SetAuditRetentionRequest {
  // 留存天数，≥1（buf.validate 与 state.ValidateRetentionDays 同值域双门
  // ——0/负数会把「关掉清理」伪装成合法设置，两层都显式拒绝）。
  int32 days = 1 [(buf.validate.field).int32 = {
    gte: 1
  }];
}

message SetAuditRetentionResponse {
  int32 days = 1;
}
