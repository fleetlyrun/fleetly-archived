syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// RevisionsService 是版本快照只读面（T2.17）：revisions 保留窗（最近 5 次
// 成功部署，release-semantics §2.4）投影——列表即回滚选项集，列不出来的
// 不可回滚。T2.18 起按需开放快照正文本面：GetRevisionSpec 返回归一化
// compose 快照（canonical JSON；env 以 key:sha256+来源表示，值明文结构性
// 不在快照中）——plan 的 RPC 基线消费（T2.18 票面：未给 --baseline 时取
// 最近成功 revision 快照为基线）。旧口径「快照全文不在此面暴露」随之收
// 窄为「按单条显式拉取」；overlay（镜像 digest 等覆盖层）仍不暴露。
service RevisionsService {
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/revisions" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc GetRevisionSpec(GetRevisionSpecRequest) returns (GetRevisionSpecResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/revisions/{revision_id}/spec" };
    option (fleetly.annotations.v1.scope) = "read";
  }
}

message ListRevisionsRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
}

message RevisionView {
  string id = 1;
  int64 seq = 2;
  string desired_hash = 3;
  // active = 可回滚选项；superseded = 被保留窗淘汰（存档）。
  string status = 4;
  bool verified = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListRevisionsResponse {
  repeated RevisionView revisions = 1;
}

message GetRevisionSpecRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // 目标快照 ID（active 集内；superseded → 404，与回滚选项面同口径）。
  string revision_id = 2 [(buf.validate.field).string.min_len = 1];
}

message GetRevisionSpecResponse {
  string revision_id = 1;
  int64 seq = 2;
  // 归一化 compose 快照（canonical JSON 文本；compose.Spec 同构——env 为
  // key:sha256，值明文结构性不在快照中）。
  string compose = 3;
}
