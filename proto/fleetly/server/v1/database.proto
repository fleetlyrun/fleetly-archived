syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// DatabaseService 是库实例资源面（E4 数据库托管，managed-databases §5.1
// 契约加法的 S2 子集：生命周期生命周期 7 RPC——create/get/list/delete/
// suspend/resume/retry/settings）。独立成 service 的理由与 CronService 同
// 型：库实例是独立一等资源（D-DB-1 用户终裁）——自有表、自有生命周期状
// 态机、不复用 apps 部署管线；并入 AppsService 会把两个领域混进一个资源面。
//
// S4/S5 域的 RPC（UpgradeDatabase/RotateDatabaseCredentials/
// TriggerDatabaseBackup/ListDatabaseBackups/RestoreDatabaseBackup）随各自
// 票据追加——本文件只加法，零 breaking。
//
// 错误语义（managed-databases §5.2，D-DB-8 零新增码）：
//   E_DB_NOT_FOUND            404（目标不存在或已进入 deleting/deleted）
//   E_DB_REFERENCED           409（有引用 app 禁删，context 带引用清单）
//   E_DB_TEMPLATE_UNSUPPORTED 400（模板 ID 未知 / 设置违反受管面）
//   E_STATE_VERSION_CONFLICT  409（前置态/CAS 冲突——context 带
//                               current_state 与合法前置态清单）
service DatabaseService {
  // CreateDatabase 创建库实例（受理即 provisioning——无 created 态；凭据
  // 生成一次、age 密文落库；收敛器异步建现场过健康门 → ready）。
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse) {
    option (google.api.http) = {
      post: "/v1/databases"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // GetDatabase 库实例详情（连接信息脱敏投影——密码明文零离开存储；显式
  // reveal 面随 S4/S6 轮换与 Console 票据）。
  rpc GetDatabase(GetDatabaseRequest) returns (GetDatabaseResponse) {
    option (google.api.http) = { get: "/v1/databases/{name}" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // ListDatabases 库实例列表（name 字典序；deleted tombstone 不进默认列表
  // ——与 apps 列表同口径）。
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse) {
    option (google.api.http) = { get: "/v1/databases" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // DeleteDatabase 删除受理（引用守卫通过后 → deleting tombstone 第一拍；
  // reap duty 幂等清理受管对象。confirm = 实例名——数据安全两段式确认；
  // delete_volumes 默认 false = 卷保留转 orphaned，true = 删数据卷不可逆）。
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse) {
    option (google.api.http) = { delete: "/v1/databases/{name}" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // SuspendDatabase 暂停（scale 0 保留服务与卷；引用方连不上是诚实暴露）。
  rpc SuspendDatabase(SuspendDatabaseRequest) returns (SuspendDatabaseResponse) {
    option (google.api.http) = {
      post: "/v1/databases/{name}/suspend"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // ResumeDatabase 恢复（paused → provisioning 重收敛 → ready/degraded）。
  rpc ResumeDatabase(ResumeDatabaseRequest) returns (ResumeDatabaseResponse) {
    option (google.api.http) = {
      post: "/v1/databases/{name}/resume"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // RetryDatabase 显式重试（failed → provisioning 重收敛；现场保留语义下
  // 失败的唯一出边）。
  rpc RetryDatabase(RetryDatabaseRequest) returns (RetryDatabaseResponse) {
    option (google.api.http) = {
      post: "/v1/databases/{name}/retry"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // UpdateDatabaseSettings 设置变更（限额 + 备份计划；任意非终态准入、主
  // 状态不变；限额变更 = spec 重建由收敛器在下一拍承载）。镜像/引擎参数
  // 受管（违规模板字段不存在于请求——E_DB_TEMPLATE_UNSUPPORTED 面）。
  rpc UpdateDatabaseSettings(UpdateDatabaseSettingsRequest) returns (UpdateDatabaseSettingsResponse) {
    option (google.api.http) = {
      put: "/v1/databases/{name}/settings"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // RotateDatabaseCredentials 凭据轮换（E4 managed-databases §2.5，S4）：
  // 破坏性两段式（confirm = 实例名）。合法前置态 ready/degraded/paused
  //（§2.3 操作表；PG 暂停期拒绝——postgres 需运行中实例才能 ALTER USER，
  // 如实报 409 并提示先 resume）。引擎侧成功后：引用方 system 物化行回
  // pending + 平台自动触发全部引用 app 重部署（各自走正常部署队列）。
  rpc RotateDatabaseCredentials(RotateDatabaseCredentialsRequest) returns (RotateDatabaseCredentialsResponse) {
    option (google.api.http) = {
      post: "/v1/databases/{name}/rotate"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // RevealDatabaseCredentials 连接信息显式展开（admin scope；§2.5「Console
  // 库详情页展示连接信息，密码默认脱敏、显式展开」的 API 面——含密码明文
  // 与完整 URL；审计 db.reveal 承载敏感访问留痕，不产生事件）。
  rpc RevealDatabaseCredentials(RevealDatabaseCredentialsRequest) returns (RevealDatabaseCredentialsResponse) {
    option (google.api.http) = { get: "/v1/databases/{name}/credentials" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // TriggerDatabaseBackup 手动备份受理（E4 S5，managed-databases §2.6）：
  // 异步受理（job 分钟级——响应即 accepted，结论经台账与 db.backup_* 事件
  // 披露；在途备份无台账行）。合法前置态 ready/degraded（§2.3 操作表）；
  // per 实例操作互斥（备份/恢复/升级并发第二笔 → 409）。s3.mode=unset →
  // E_S3_NOT_CONFIGURED（409——诚实拒绝，与注入前哨同码同语义）。
  rpc TriggerDatabaseBackup(TriggerDatabaseBackupRequest) returns (TriggerDatabaseBackupResponse) {
    option (google.api.http) = {
      post: "/v1/databases/{name}/backups"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // ListDatabaseBackups 备份台账列表（created_at 降序——恢复目标选择与
  // Console 备份列表的数据源；kind/snapshot/size/verify_status/error 全量
  // 事实面）。
  rpc ListDatabaseBackups(ListDatabaseBackupsRequest) returns (ListDatabaseBackupsResponse) {
    option (google.api.http) = { get: "/v1/databases/{name}/backups" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // RestoreDatabaseBackup 原地恢复受理（破坏性两段式 confirm + 快照归属
  // 守卫：只重放本实例台账内的快照）。停库重放：实例 scale 0 → job 挂卷
  // rw 重放 → 重部署（异步——结论经 db.restore_* 事件披露；恢复中断 =
  // 实例保持停止 + E_DB_RESTORE_FAILED 事件的 critical 口径，§2.6）。
  rpc RestoreDatabaseBackup(RestoreDatabaseBackupRequest) returns (RestoreDatabaseBackupResponse) {
    option (google.api.http) = {
      post: "/v1/databases/{name}/restore"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // UpgradeDatabase 受控升级受理（E4 S5，managed-databases §2.2）：①
  // pre_upgrade 备份门（verify 通过才继续——失败实例不动）②digest 换新
  // 受控重建 ③健康门 ④失败 = digest 归位 + db.upgrade_failed + 状态落
  // degraded。异步受理（备份门与健康门是分钟级）；paused = 仅换 spec 不
  // 重启（resume 时以新版本重建）。合法前置态 ready/degraded/paused。
  rpc UpgradeDatabase(UpgradeDatabaseRequest) returns (UpgradeDatabaseResponse) {
    option (google.api.http) = {
      post: "/v1/databases/{name}/upgrade"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
}

message CreateDatabaseRequest {
  // 库实例名（^[a-z0-9][a-z0-9_-]*$——与 app 名同字符集规则；对象前缀族
  // fleetly-db-* 与 app 名族解耦，app 与库实例可重名）。project 内唯一
  // （D-W0-4 二修——跨项目同名实例合法）。
  string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]*$"];
  // 模板 ID（平台内置注册表：postgres-16 / postgres-18 /
  // percona-postgresql-18 / redis-7 / mysql-8.4 / mongodb-8.0；未知 → 400）。
  // **大版本升级不做**（创建时钉死）：升 major = dump/restore 到新实例；
  // minor 由镜像 digest 钉定、随平台 release 以同卷受控重建演进
  //（UpgradeDatabase）。
  string template = 2 [(buf.validate.field).string.min_len = 1];
  // 资源限额（零值字段回落模板缺省——PG 1C/1Gi、Redis 0.5C/256Mi、
  // MySQL/Mongo 1C/1Gi）。
  DatabaseLimits limits = 3;
  // 备份计划（零值字段回落平台缺省 24h/7 份/03:00 UTC）。
  DatabaseBackupPlan backup_plan = 4;
  // 目标项目（v0.3 W2-S3 归属管道，D-W0-9 解析规则）：裸名或
  // `team/project` 限定形；解析规则与缺省语义同 DeployRequest.project
  //（机具令牌必须显式）。首次创建写入 db_instances.project_id/team_id；
  // 行上归属已定时必须一致（409 E_APP_PROJECT_MISMATCH 指引 MoveDatabase）。
  string project = 5 [(buf.validate.field).string.max_len = 65];
}

message CreateDatabaseResponse {
  DatabaseView database = 1;
}

message GetDatabaseRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message GetDatabaseResponse {
  DatabaseView database = 1;
}

message ListDatabasesRequest {
  // 行数上限（缺省 100）。
  int32 limit = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // 项目收窄（v0.3 W2-S4 可见性过滤，rbac-teams §4.2）：裸名或 `team/project`
  // 限定形（D-W0-9 解析规则；解析域 = 调用方可见项目集，机具令牌/平台管理
  // 员 = 全库）。空 = 不收窄（用户面仍按可见项目集过滤）。
  string project = 2 [(buf.validate.field).string.max_len = 65];
}

message ListDatabasesResponse {
  repeated DatabaseView databases = 1;
}

message DeleteDatabaseRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 破坏性确认 = 实例名原样回传（mismatch → 400——与卷-节点 409 前哨同
  // 型的数据安全面；引用 app 在册 → 409 E_DB_REFERENCED 先行）。
  string confirm = 2;
  // 删除数据卷（默认 false = 保留转 orphaned；true = 不可逆删除）。
  bool delete_volumes = 3;
}

message DeleteDatabaseResponse {
  string name = 1;
  string status = 2;
}

message SuspendDatabaseRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message SuspendDatabaseResponse {
  DatabaseView database = 1;
}

message ResumeDatabaseRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ResumeDatabaseResponse {
  DatabaseView database = 1;
}

message RetryDatabaseRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message RetryDatabaseResponse {
  DatabaseView database = 1;
}

message UpdateDatabaseSettingsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 资源限额（零值字段回落模板缺省；limits 变更 = spec 重建由收敛器承载）。
  DatabaseLimits limits = 2;
  // 备份计划（备份调度执行体随 S5 票据；本面先行受理与展示）。
  DatabaseBackupPlan backup_plan = 3;
}

message UpdateDatabaseSettingsResponse {
  DatabaseView database = 1;
}

// DatabaseLimits 是资源限额（仅 limits——镜像/引擎参数受管）。
message DatabaseLimits {
  // CPU 限额（核数；0 = 模板缺省）。
  double cpu_seconds = 1;
  // 内存限额（字节；0 = 模板缺省）。
  int64 memory_bytes = 2;
}

// DatabaseBackupPlan 是备份计划（§5.4 配置键 databases.backup_* 的 per
// 实例覆盖；0 值字段 = 平台缺省）。
message DatabaseBackupPlan {
  int32 interval_hours = 1;
  int32 keep = 2;
  int32 hour_utc = 3;
}

// RotateDatabaseCredentialsRequest 是凭据轮换受理（破坏性两段式：confirm =
// 实例名原样回传，mismatch → 400——与 DeleteDatabase 同型的数据安全面）。
message RotateDatabaseCredentialsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string confirm = 2;
}

message RotateDatabaseCredentialsResponse {
  DatabaseView database = 1;
  // 平台自动重部署的引用 app 名单（各自走正常部署队列；credential_updated_at
  // 展示随 database.credential_updated_at 刷新）。
  repeated string redeployed_apps = 2;
}

message RevealDatabaseCredentialsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// RevealDatabaseCredentialsResponse 是连接信息的显式展开投影（§2.5 键集
// 全量 + 密码明文——admin scope 专用面；值只出现在本响应，不进日志/事件/
// 审计，审计 db.reveal 只记访问事实）。
message RevealDatabaseCredentialsResponse {
  string name = 1;
  string template = 2;
  string host = 3;
  int32 port = 4;
  // PG 有 user/database；Redis 不输出（空串）。
  string user = 5;
  string database = 6;
  // 密码明文（显式展开面的设计内例外；凭据字符集 [a-zA-Z0-9]）。
  string password = 7;
  // 标准 URI（密码段为明文——与 GetEnv 明文读同级的 admin 面）。
  string url = 8;
}

// DatabaseView 是库实例投影（状态 = 生命周期态；连接信息脱敏——密码明文
// 零离开存储，url 已掩码、password_fingerprint 供「是不是那个 secret」比
// 对；显式 reveal 面随 S4/S6）。last_error 是最近一次收敛失败原因（failed
// 诊断面；'' = 无失败现场）。
message DatabaseView {
  string id = 1;
  string name = 2;
  string template = 3;
  string image_digest = 4;
  // 生命周期状态位（provisioning|ready|failed|degraded|paused|deleting|deleted）。
  string status = 5;
  // 放置绑定（平台节点 ID；空 = 未绑定——provisioning 首拍前）。
  string placement = 6;
  // 数据卷投影（name = docker 卷名；status = active|orphaned|discarded；
  // 空 = 尚未登记）。
  DatabaseVolumeView volume = 7;
  // 连接信息脱敏投影。
  DatabaseConnectionView connection = 8;
  DatabaseBackupPlan backup_plan = 9;
  DatabaseLimits limits = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp credential_updated_at = 13;
  // 最近一次收敛失败原因（failed/deleting 前的现场快照；空 = 无失败现场）。
  string last_error = 14;
  // 可升级位（E4 S5，§2.2 升级语义）：instance.image_digest ≠ 模板当前钉
  // 定镜像 = true（升级逐实例 opt-in——既有实例不自动变）。
  bool upgrade_available = 15;
}

message DatabaseVolumeView {
  string name = 1;
  string status = 2;
  // 数据节点（卷钉住语义——与 placement 一致）。
  string platform_node_id = 3;
}

// DatabaseConnectionView 是连接信息脱敏投影（§2.5 键集的只读面）。url 中
// 密码段恒为固定掩码（********）——明文零离开存储；host = 实例名 DNS 别名
//（引用方 app 内即以此可达）。
message DatabaseConnectionView {
  string host = 1;
  int32 port = 2;
  // PG 有 user/database；Redis 为空串/0（gateway EmitUnpopulated=true 下
  // 显式输出——消费方按空值跳过渲染）。
  string user = 3;
  string database = 4;
  // 掩码 URL（postgres://fleetly:********@<host>:5432/<db> / redis://:********@<host>:6379/0）。
  string url = 5;
  // 密码指纹（sha256 前 8 hex——只判「是不是那个值」，材料零出现）。
  string password_fingerprint = 6;
}

// ── E4 S5：备份/恢复/升级面（managed-databases §5.1 契约加法）────────────

message TriggerDatabaseBackupRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 备份类别（缺省 manual；API 面只受理 manual——daily/pre_upgrade 是平台
  // 调度与升级门的内部类别）。
  string kind = 2;
}

// 异步受理响应：job 分钟级——结论经台账（ListDatabaseBackups）与
// db.backup_succeeded / db.backup_failed 事件披露；在途备份无台账行。
message TriggerDatabaseBackupResponse {
  string name = 1;
  string kind = 2;
  // 恒为 "accepted"。
  string status = 3;
}

message ListDatabaseBackupsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 行数上限（缺省 20）。
  int32 limit = 2 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
}

message ListDatabaseBackupsResponse {
  repeated DatabaseBackupView backups = 1;
}

// DatabaseBackupView 是一行备份台账投影（§2.6 台账裁决的全量事实面）。
message DatabaseBackupView {
  string id = 1;
  // 备份类别（daily|manual|pre_upgrade）。
  string kind = 2;
  // restic repo 内 snapshot 标识（db/<instance>/ 命名空间寻址，非文件路径）。
  string snapshot = 3;
  // 导出流字节量（0 = 未记录）。
  int64 size_bytes = 4;
  // 回读校验状态（unverified|verified|failed——「备份假成功」零容忍）。
  string verify_status = 5;
  // 失败/校验失败原因摘要（单行；凭据材料零出现）。
  string error = 6;
  google.protobuf.Timestamp created_at = 7;
}

message RestoreDatabaseBackupRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 恢复目标（restic snapshot 标识——必须在本实例台账内，跨实例误指 422）。
  string snapshot = 2 [(buf.validate.field).string.min_len = 1];
  // 破坏性确认 = 实例名原样回传（mismatch → 400——原地重放覆盖数据卷上
  // 的现库，与 DeleteDatabase 同型的数据安全面）。
  string confirm = 3;
}

// 异步受理响应：停库重放分钟级——结论经 db.restore_completed /
// db.restore_failed 事件与实例 last_error 披露；恢复中断 = 实例保持停止
// （人工 runbook 随事件/错误文本）。
message RestoreDatabaseBackupResponse {
  string name = 1;
  string snapshot = 2;
  // 恒为 "accepted"。
  string status = 3;
}

message UpgradeDatabaseRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 破坏性确认 = 实例名原样回传（mismatch → 400——受控重建有停机窗口，
  // 且失败路径触发 digest 归位重建）。
  string confirm = 2;
}

// 异步受理响应：备份门与健康门是分钟级——结论经 db.upgrade_started/
// finished/failed 事件披露。view = 受理时刻投影（upgrade_available 尚为
// true；digest 切换随编排推进）。
message UpgradeDatabaseResponse {
  DatabaseView database = 1;
  // 恒为 "accepted"。
  string status = 2;
}
