syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

import "fleetly/server/v1/deployments.proto";
import "fleetly/server/v1/placement.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合——不用生成器默认的
// rpcStatus，信封单一事实源在 fleetly.shared.v1.ErrorResponse）。与
// system.proto 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// AppsService 是应用资源面（T2.17）：列表带派生状态（state-model §2.10，
// running/degraded/blocked/down——读面即时推导，读 API 不落库）、详情带
// placement 与最近部署、删除走 tombstone 生命周期（active → deleting →
// deleted，state 现有状态机；删除进行中/保留期内名字不释放）。
service AppsService {
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse) {
    option (google.api.http) = { get: "/v1/apps" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc GetApp(GetAppRequest) returns (GetAppResponse) {
    option (google.api.http) = { get: "/v1/apps/{name}" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse) {
    option (google.api.http) = { delete: "/v1/apps/{name}" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // SetAppWebhookSecret 设置 per-app webhook 签名密钥（T2.19；admin）。
  // 值经平台 envelope 加密落库（明文不落），show 面只回 configured 位。
  // 未配置 = webhook 端点未启用（404 语义）。
  rpc SetAppWebhookSecret(SetAppWebhookSecretRequest) returns (SetAppWebhookSecretResponse) {
    option (google.api.http) = {
      put: "/v1/apps/{name}/webhook-secret"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // ShowAppWebhook 回读 webhook/git 触发配置（无敏感投影：secret 只回
  // configured 位；admin scope——source URL 与分支拓扑属运维面）。
  rpc ShowAppWebhook(ShowAppWebhookRequest) returns (ShowAppWebhookResponse) {
    option (google.api.http) = { get: "/v1/apps/{name}/webhook" };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // SetAppSource 设置 webhook 拉源配置（remote url + 分支 + 认证形态；
  // admin）。source_branch 同时是 git push 的触发分支（app 配置分支，
  // 默认 main）。
  // 认证材料（https_token/ssh_key）经平台 envelope 加密落库，引用不落明文。
  rpc SetAppSource(SetAppSourceRequest) returns (SetAppSourceResponse) {
    option (google.api.http) = {
      put: "/v1/apps/{name}/source"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "admin";
  }
  // GetScalingPolicy 读取服务的自动扩缩策略（W5-S1，D-V3W5-2；read 门——
  // 策略是应用运行面的事实视图）。未设置返回 404（未配置即无策略）。
  rpc GetScalingPolicy(GetScalingPolicyRequest) returns (GetScalingPolicyResponse) {
    option (google.api.http) = { get: "/v1/apps/{name}/scaling/{service}" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // SetScalingPolicy 写入（整行替换 upsert）服务的自动扩缩策略（deploy 门
  // ——资源面写语义，与 Deploy/SetEnv 同级；用户 principal 另受项目角色门
  // 约束，机具令牌 admin 等价照旧）。约束：min ≥1、max ≤16、target ∈
  // [20,90]（0 = 该维度不设目标，至少一维必设）、cooldown ∈ [60,3600]s
  // 缺省 180。生效前置：metrics.mode=on 且服务 running（metrics off 时
  // 策略休眠——scaling.dormant 事件一次性披露）；有卷服务只扩不缩。
  rpc SetScalingPolicy(SetScalingPolicyRequest) returns (SetScalingPolicyResponse) {
    option (google.api.http) = {
      put: "/v1/apps/{name}/scaling/{service}"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
  // RemoveScalingPolicy 删除服务的自动扩缩策略（deploy 门）。同键运行期
  // 副本覆盖一并清除——期望副本回落 compose 快照（外部改动照常走漂移判据）。
  rpc RemoveScalingPolicy(RemoveScalingPolicyRequest) returns (RemoveScalingPolicyResponse) {
    option (google.api.http) = { delete: "/v1/apps/{name}/scaling/{service}" };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
}

message ListAppsRequest {
  // 列表上限（缺省 100；v0.1 单机规模不做分页游标）。
  int32 limit = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // 项目收窄（v0.3 W2-S4 可见性过滤，rbac-teams §4.2）：裸名或 `team/project`
  // 限定形（D-W0-9 解析规则；解析域 = 调用方可见项目集，机具令牌/平台管理
  // 员 = 全库）。空 = 不收窄（用户面仍按可见项目集过滤）。
  string project = 2 [(buf.validate.field).string.max_len = 65];
}

message AppView {
  string id = 1;
  string name = 2;
  // 生命周期状态位：active / deleting / deleted。
  string lifecycle = 3;
  // 派生状态：running / degraded / blocked / down（读面即时推导）。
  string derived_state = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // 归属 slug（v0.3 W2-S3 归属模型；Console 限定形展示与团队级收窄过滤
  // 的数据源——此前无归属投影，同名 app 在列表面不可分）。
  string team_slug = 7;
  string project_slug = 8;
  // 归属项目平台 ID（IMPL-T15-1：项目详情链接与项目网操作的目标锚；
  // 管理面用 ID，免疫跨团队同名项目歧义）。
  string project_id = 9;
  // 项目网参与状态（IMPL-T15-1/OT-1 显式 opt-in）：attached=true 时
  // project_network = 项目网 overlay 名（`fleetly-project-<project_id>`），
  // 成员服务在 app 私网之外双挂该网（项目网别名 `<app>-<service>`）；
  // 缺省 false = 不参加（既有 app 私网隔离现状）。
  bool project_network_attached = 10;
  string project_network = 11;
}

message ListAppsResponse {
  repeated AppView apps = 1;
}

message GetAppRequest {
  // 应用名（compose 应用名，权威态唯一键）。
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message GetAppResponse {
  string id = 1;
  string name = 2;
  string lifecycle = 3;
  string derived_state = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // 归属 slug（AppView 同款；详情头与列表行的限定形展示同源）。
  string team_slug = 9;
  string project_slug = 10;
  // 归属项目平台 ID 与项目网参与投影（IMPL-T15-1；AppView 同款字段，
  // 详情页的项目网卡数据源）。
  string project_id = 11;
  bool project_network_attached = 12;
  string project_network = 13;
  // 放置绑定（未绑定时不输出——EmitUnpopulated=false 语义下 message 零值
  // 字段不渲染，读面缺省即「无绑定」）。
  PlacementView placement = 7;
  // 最近部署（created_at 倒序，至多 5 条；派生状态的正交细节）。
  repeated DeploymentView recent_deployments = 8;
}

message DeleteAppRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteAppResponse {
  string name = 1;
  // 删除推进后的生命周期位（active → deleting）。
  string lifecycle = 2;
}

message SetAppWebhookSecretRequest {
  // 应用名。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // webhook 签名密钥（HMAC-SHA256 原料，GitHub/Gitea 同形态）。≥16 字符
  // ——弱密钥显式拒绝（验签是该端点的唯一认证）。
  string secret = 2 [(buf.validate.field).string = { min_len: 16, max_len: 512 }];
}

message SetAppWebhookSecretResponse {
  string name = 1;
  // 恒 true（设置成功即已配置）。
  bool configured = 2;
}

message ShowAppWebhookRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ShowAppWebhookResponse {
  string name = 1;
  // webhook 签名密钥已配置（secret 值永不回读）。
  bool secret_configured = 2;
  // 拉源配置（未设置时 url/branch 为空串、auth_kind = none）。
  string source_url = 3;
  // app 配置分支（默认 main）：push 触发与 webhook 拉取共用此分支。
  string source_branch = 4;
  // none | https_token | ssh_key。
  string source_auth_kind = 5;
  // 6 曾为 branch（与 source_branch 同值重复投影，2026-09-20 命名审查删除）。
  reserved 6;
  reserved "branch";
  // push/webhook 端点提示（SSH git URL，如 ssh://git@host:8424/<app>.git；
  // 主机位取 control-plane 可达地址的尽力形态）。
  string git_remote_hint = 7;
}

message SetAppSourceRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 拉源 remote URL（file:// 与 https://、ssh:// 形态）。
  string source_url = 2 [(buf.validate.field).string.max_len = 2048];
  // app 配置分支（默认 main）：push 触发与 webhook 拉取共用此分支。
  string source_branch = 3 [(buf.validate.field).string = { min_len: 1, max_len: 200 }];
  // 认证形态：none | https_token | ssh_key。
  string source_auth_kind = 4 [(buf.validate.field).string = { in: ["none", "https_token", "ssh_key"] }];
  // 认证材料（https_token = token 原文；ssh_key = PEM 私钥）。source_auth_kind =
  // none 时必须为空；服务端 envelope 加密落库，明文不落、永不回读。
  // protovalidate 形状约束在服务端用例层按 source_auth_kind 交叉校验（跨字段
  // 规则—— CEL 交叉字段此处不引入，保持 proto 面最小）。
  string source_auth_secret = 5 [(buf.validate.field).string.max_len = 16384];
}

message SetAppSourceResponse {
  string name = 1;
  string source_url = 2;
  string source_branch = 3;
  string source_auth_kind = 4;
}

message GetScalingPolicyRequest {
  // 应用名（裸名/限定形，resolveApp 单点解析）。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // compose 服务名。
  string service = 2 [(buf.validate.field).string = { min_len: 1, max_len: 100 }];
}

message GetScalingPolicyResponse {
  string name = 1;
  string service = 2;
  // 副本下限（≥1）。
  int32 min_replicas = 3;
  // 副本上限（≤16——swarm 单服务上限口径）。
  int32 max_replicas = 4;
  // CPU 目标水位百分数（[20,90]；0 = 未设该维度目标）。
  int32 target_cpu_pct = 5;
  // 内存目标水位百分数（[20,90]；0 = 未设该维度目标）。
  int32 target_mem_pct = 6;
  // 动作冷却窗秒数（[60,3600]，缺省 180）。
  int32 cooldown_seconds = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message SetScalingPolicyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string service = 2 [(buf.validate.field).string = { min_len: 1, max_len: 100 }];
  // 副本下限（≥1；必填）。
  int32 min_replicas = 3 [(buf.validate.field).int32 = { gte: 1, lte: 16 }];
  // 副本上限（≤16 且 ≥ min；必填）。
  int32 max_replicas = 4 [(buf.validate.field).int32 = { gte: 1, lte: 16 }];
  // CPU 目标水位（0 = 不设该维度；至少一维非 0）。
  int32 target_cpu_pct = 5 [(buf.validate.field).int32 = { gte: 0, lte: 90 }];
  // 内存目标水位（0 = 不设该维度；至少一维非 0）。
  int32 target_mem_pct = 6 [(buf.validate.field).int32 = { gte: 0, lte: 90 }];
  // 冷却窗秒数（0 = 缺省 180）。
  int32 cooldown_seconds = 7 [(buf.validate.field).int32 = { gte: 0, lte: 3600 }];
}

message SetScalingPolicyResponse {
  // 写入后的策略视图（与 GetScalingPolicy 同构）。
  GetScalingPolicyResponse policy = 1;
}

message RemoveScalingPolicyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string service = 2 [(buf.validate.field).string = { min_len: 1, max_len: 100 }];
}

message RemoveScalingPolicyResponse {
  string name = 1;
  string service = 2;
  // 恒 true（删除成功即无策略）。
  bool removed = 3;
}
