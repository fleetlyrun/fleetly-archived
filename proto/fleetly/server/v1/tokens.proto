syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// TokensService 是 API token 管理面（T2.17；state-model §2.9：哈希存储，
// 明文永不落库）。v0.3 W2 语义迁移（rbac-teams 设计 §2.3）：从「admin
// 全局面」改为「用户自服务面」——登录用户管自己的 PAT（创建/列表/吊销；
// 声明 scopes ⊆ 用户可达集校验，防呆非防险——角色门仍是硬边界）；平台
// 管理员可看全部、可建平台级机具令牌（user NULL；machine 旗标显式）；
// 机具令牌按「平台管理员等价」读全列、写面须 admin scope。scope 门登记
// read（最小形状约束），真授权在 handler 内（teams/projects 同款切面）。
//
// CreateToken 返回的明文 token **仅此一次**可见——服务端只存 sha256 哈希，
// 丢失只能 revoke 后重建。
service TokensService {
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse) {
    option (google.api.http) = {
      post: "/v1/tokens"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {
    option (google.api.http) = { get: "/v1/tokens" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {
    option (google.api.http) = { delete: "/v1/tokens/{id}" };
    option (fleetly.annotations.v1.scope) = "read";
  }
}

message CreateTokenRequest {
  // scope 集（read / deploy / terminal / tasks / build / admin；admin 蕴含
  // deploy 蕴含 read ⊕ terminal ⊕ tasks ⊕ build——terminal 为 Web 终端独立
  // scope、tasks 为程序化动态工作负载面独立 scope（DT-5）、build 为上传
  // 构建面独立 scope（DT-6），三者 read/deploy 均不蕴含（E7 W5-S6 /
  // IMPL-T2-1 / IMPL-T2-2）；重复项服务端归一去重）。
  repeated string scopes = 1 [(buf.validate.field).repeated = {
    min_items: 1,
    items: { string: { in: ["read", "deploy", "terminal", "tasks", "build", "admin"] } }
  }];
  // 备注（人读；如 "CI 部署"）。字段名 note（name 列承载，兼容既有表结构）。
  string note = 2 [(buf.validate.field).string.max_len = 200];
  // 绑定项目（可选；设计 §2.3 project_id 收窄维度——W2-S4 角色门消费）。
  // 提供时须为在册项目（未知 → 400）。
  string project_id = 3 [(buf.validate.field).string.max_len = 64];
  // 机具令牌旗标（设计 §2.3：平台级凭据 = 平台管理员显式创建）。true 时
  // 产出 user NULL 的机具令牌：调用方须为平台管理员用户或 admin scope
  // 机具令牌，否则 403。缺省 false = 用户自服务 PAT（机具令牌调用方无
  // 用户身份，恒产出机具令牌——与既有 CI 形态兼容）。
  bool machine = 4;
}

message CreateTokenResponse {
  string id = 1;
  // 明文 token（flt_<随机 48 hex>），仅本次响应可见。
  string token = 2;
  string note = 3;
  repeated string scopes = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListTokensRequest {}

// TokenView 是 token 行的无敏感投影：备注/scope/哈希前缀——明文与完整
// 哈希永不回读（state-model §2.9）。
message TokenView {
  string id = 1;
  string note = 2;
  repeated string scopes = 3;
  // token_hash 前 12 hex（识别用，非凭据）。
  string hash_prefix = 4;
  google.protobuf.Timestamp created_at = 5;
  // 最近使用；从未使用时不输出。
  google.protobuf.Timestamp last_used_at = 6;
  // 已吊销时不输出（列表默认只出在册 token）。
  google.protobuf.Timestamp revoked_at = 7;
  // 属主用户（W2 §2.3 用户化注记）：非空 = 用户 PAT 的属主 id；空 = 平台
  // 机具令牌（gateway EmitUnpopulated=true 下机具令牌显式输出空串）。
  string user_id = 8;
  // 绑定项目（空 = 不绑定；EmitUnpopulated=true 下显式输出空串）。
  string project_id = 9;
}

message ListTokensResponse {
  repeated TokenView tokens = 1;
}

message RevokeTokenRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RevokeTokenResponse {
  string id = 1;
  string revoked_at = 2;
}
