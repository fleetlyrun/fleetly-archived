syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 logs.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// MetricsService 是托管 metrics 三件套的设置/状态/查询面（E6 观测专项设计
// §4，W5-S3；D-W5-2 opt-in——metrics.mode 缺省 unset，零新增常驻）。
//
// 诚实口径（设计 §4.2 原文）：**操作员工具，SearchMetrics 的 PromQL 透传、
// 不做查询沙箱**——query 原样转发给托管 VictoriaMetrics（单机版），平台
// 不声称任何查询隔离；坏表达式由 VM 拒绝并以 InvalidArgument 透传错误
// 原文。mode=unset 查询 → E_METRICS_NOT_ENABLED；VM 不可达 →
// E_METRICS_BACKEND_UNAVAILABLE（不返回空序列冒充有数）。
service MetricsService {
  // SearchMetrics 执行 PromQL 区间查询（read scope）：127.0.0.1:8428
  // /api/v1/query_range 的规范化投影（label 集 + {t,v} 点集）。
  rpc SearchMetrics(SearchMetricsRequest) returns (SearchMetricsResponse) {
    option (google.api.http) = { get: "/v1/metrics/search" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // GetMetricsStatus 托管 metrics 栈状态视图（read scope）：模式 / 三件
  // 部署态 / 节点上报比 / retention——「N/M nodes reporting」的诚实口径。
  rpc GetMetricsStatus(GetMetricsStatusRequest) returns (GetMetricsStatusResponse) {
    option (google.api.http) = { get: "/v1/metrics/status" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  // SetMetricsMode 切换 metrics 模式（unset | on）：保存即生效——duty 收敛
  // 部署/移除（数据卷保留），deploy scope（同 SetLogsBackend 分级理由）。
  rpc SetMetricsMode(SetMetricsModeRequest) returns (SetMetricsModeResponse) {
    option (google.api.http) = { put: "/v1/metrics/mode" body: "*" };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
}

message SearchMetricsRequest {
  // PromQL 表达式——**透传**（不转义、不校验语法、无沙箱；VM 裁决）。
  string query = 1 [(buf.validate.field).string = { min_len: 1, max_len: 4096 }];
  // 时间窗下界；缺省 = 现在回望 1 小时。
  google.protobuf.Timestamp time_start = 2;
  // 时间窗上界；缺省 = 现在。
  google.protobuf.Timestamp time_end = 3;
  // 步长秒数（缺省 60）。
  int32 step_seconds = 4 [(buf.validate.field).int32 = { gte: 0, lte: 86400 }];
  // 返回序列数上限（缺省 200，天花板 1000——规范化面截断）。
  int32 limit = 5 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
}

// MetricsPoint 是单个采样点（t = unix 秒；v = 采样值）。
message MetricsPoint {
  int64 t = 1;
  double v = 2;
}

// MetricsSeries 是一条时序（label 集原样透传——含 __name__ 原始指标名；
// 函数产出的序列无该 label，透传不补造）。
message MetricsSeries {
  map<string, string> metric = 1;
  repeated MetricsPoint points = 2;
}

message SearchMetricsResponse {
  repeated MetricsSeries series = 1;
}

message GetMetricsStatusRequest {}

// MetricsComponentView 是单件托管服务的部署态投影。
message MetricsComponentView {
  string name = 1;
  // 服务是否在位（mode=on 且 false = duty 收敛中——过渡态红面）。
  bool exists = 2;
  // 实况镜像引用（不在位为空）。
  string image = 3;
}

// GetMetricsStatusResponse 是状态视图（设计 §4.1/§4.2 诚实口径）：mode /
// 三件部署态 / 节点上报比（以实际抓到的 cAdvisor 目标数计——跨节点采集
// 依赖 overlay 数据面，worker 节点缺席时不谎报 M/M）/ retention。
message GetMetricsStatusResponse {
  // 生效模式：unset | on（缺省 unset；未显式设置时 mode 已投影为缺省值，
  // set 标志区分「缺省生效」）。
  string mode = 1;
  // 该键是否被显式保存过（false = 缺省态生效）。
  bool mode_set = 2;
  // 三件部署态（cAdvisor / node_exporter / VictoriaMetrics 固定序）。
  repeated MetricsComponentView components = 3;
  // 正在向 VM 上报的节点数（up{job="fleetly-cadvisor"} 计数；VM 不可达
  // = 0——配合 components 部署态解读，不单独谎报）。
  int32 nodes_reporting = 4;
  // 集群节点总数（观测缓存投影）。
  int32 nodes_total = 5;
  // VM -retentionPeriod 对齐天数（config 键 metrics.retention_days）。
  int32 retention_days = 6;
}

message SetMetricsModeRequest {
  string mode = 1 [(buf.validate.field).string = {
    in: ["unset", "on"]
  }];
}

message SetMetricsModeResponse {
  GetMetricsStatusResponse status = 1;
}
