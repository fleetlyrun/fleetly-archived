syntax = "proto3";

package fleetly.server.v1;

option go_package = "github.com/fleetlyrun/fleetly/genproto/fleetly/server/v1;serverv1";

import "buf/validate/validate.proto";
import "fleetly/annotations/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

import "fleetly/server/v1/builds.proto";

// 文件级 swagger 声明：default 错误响应引用 shared 的 ErrorResponse 信封
//（与 buf.gen.yaml 的 disable_default_errors=true 配合）。与 system.proto
// 同款惯例，逐文件声明。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".fleetly.shared.v1.ErrorResponse" } }
    }
  }
};

// DeploymentsService 是部署资源面（T2.17，发布专项状态机行投影）。
//
// Deploy 契约取舍（T2.17 设计裁决）：客户端传 compose 文件**内容字节** +
// 应用名，服务端走引擎入队（deployments queued 行 + deployment.queued
// 事件 + 审计），返回 deployment id 后立即返回——等待终态由客户端轮询
// GetDeployment 或消费事件流（部署是长事务，不占 HTTP/gRPC 连接）。
// Rollback 复用引擎 EnqueueRollback（快照单层重放）；Cancel 是受限语义
// （未切流可取消，曾健康 409 E_STATE_VERSION_CONFLICT，建议 rollback）。
service DeploymentsService {
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse) {
    option (google.api.http) = { get: "/v1/apps/{app}/deployments" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse) {
    option (google.api.http) = { get: "/v1/deployments/{id}" };
    option (fleetly.annotations.v1.scope) = "read";
  }
  rpc Deploy(DeployRequest) returns (DeployResponse) {
    option (google.api.http) = {
      post: "/v1/apps/{app}/deployments"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
  rpc CancelDeployment(CancelDeploymentRequest) returns (CancelDeploymentResponse) {
    option (google.api.http) = {
      post: "/v1/deployments/{id}/cancel"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
  rpc RollbackDeployment(RollbackDeploymentRequest) returns (RollbackDeploymentResponse) {
    option (google.api.http) = {
      post: "/v1/apps/{app}/rollbacks"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
  // DeployFromGit 是 git push(SSH) 触发入口的服务端入队（T2.19）：post-
  // receive 钩子经 loopback REST 携带 hook token 调用；compose 字节由服务
  // 端从 bare 仓库 `git show <sha>:compose.{yaml,yml}` 自取（compose 真源
  // 在 git 对象库，不信任客户端传字节）。幂等口径：git push 是显式用户
  // 动作——每次调用都建部署记录（引擎同 spec 重放安全）；(app, sha) 去重
  // 仅属 webhook 入口。scope = deploy（hook token 最小权限）。
  rpc DeployFromGit(DeployFromGitRequest) returns (DeployFromGitResponse) {
    option (google.api.http) = {
      post: "/v1/apps/{app}/deployments/git"
      body: "*"
    };
    option (fleetly.annotations.v1.scope) = "deploy";
  }
}

// DeploymentView 是部署状态机行的只读投影（词表与 state 层一致：
// queued/preparing/building/releasing/observing/succeeded/failed/cancelled）。
message DeploymentView {
  string id = 1;
  string app = 2;
  // deploy | rollback。
  string kind = 3;
  string status = 4;
  // 子状态（blocked_waiting 或空）。
  string phase = 5;
  string revision_id = 6;
  string error_code = 7;
  string verdict = 8;
  // 同记录恢复记录（replay | blocked；空 = 无）。
  string recovery = 9;
  // 首发失败 scale=0 保留现场。
  bool substrate_halted = 10;
  google.protobuf.Timestamp first_healthy_at = 11;
  int64 downtime_ms = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // git 触发来源（T2.19）：仅经 git push(SSH)/webhook 入队（DeployFromGit
  // 路径）的部署非空——sha 为 40 位 commit、ref 为 refs/heads/<branch>；
  // API/CLI 直传 compose 的部署为空（EmitUnpopulated=false 语义下不输出）。
  // webhook 入口的 (app, sha) 幂等去重即以此字段为判据，读面回显供
  // AI-Agent/运营核对「这次部署来自哪个 commit」。
  string source_git_sha = 15;
  string source_git_ref = 16;
}

message ListDeploymentsRequest {
  // 应用名（列表必选）。
  string app = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2 [(buf.validate.field).int32 = { gte: 0, lte: 100 }];
}

message ListDeploymentsResponse {
  repeated DeploymentView deployments = 1;
}

message GetDeploymentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetDeploymentResponse {
  DeploymentView deployment = 1;
}

message DeployRequest {
  // 应用名（不存在时自动创建——与 CLI deploy 同语义：应用随首次部署创建）。
  // compose 应用名与请求 app 必须一致（A1：不一致 → E_COMPOSE_UNSUPPORTED，
  // 不误建 app、不入队）。app 名 project 内唯一（D-W0-4 二修）——同一项目
  // 内重复部署沿用行上归属（请求 project 必须一致，不一致 409
  // E_APP_PROJECT_MISMATCH 指引 MoveApp）。
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // compose 文件内容字节（JSON/YAML 原文；服务端落临时文件走受控子集
  // 校验——compose 违约不动底座、不入队）。
  bytes compose = 2 [(buf.validate.field).bytes.min_len = 1];
  // 破坏性变更确认门控（架构 §2.4 变更计划/确认语义，MG-C3）：本次部署相对
  // 最新 revision 的变更集含破坏性操作（服务删除/卷解绑——判定单源在
  // compose 包，与 plan artifact 的 requires_confirm_destructive 同口径）时，
  // 必须显式置位才放行入队；未置位返回 E_DEPLOY_CONFIRM_REQUIRED、不入队。
  // 首发（无历史 revision）恒非破坏性，置位与否均放行。
  bool confirm_destructive = 3;
  // 目标项目（v0.3 W2-S3 归属管道，D-W0-9 解析规则）：裸名或 `team/project`
  // 限定形。裸名仅解析域内唯一时可用（用户 = 可见项目集；机具令牌/平台
  // 管理员 = 全库），多命中 400 E_PROJECT_AMBIGUOUS 列候选。缺省：用户 =
  // 个人队 default 项目；机具令牌无缺省（必须显式，否则 400 带指引）。
  // 首次部署写入 apps.project_id/team_id；行上归属已定时必须一致（409）。
  string project = 4 [(buf.validate.field).string.max_len = 65];
}

// DeployFromGitRequest 携带 push 上下文（app 来自 REST 路径）。ref 形如
// refs/heads/main；sha 为 40 位十六进制 commit（服务端严格校验）。
message DeployFromGitRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  string sha = 2 [(buf.validate.field).string.len = 40];
  string ref = 3 [(buf.validate.field).string.min_len = 1];
  // push 署名用户（W2 §2.3 审计 actor 联动）：post-receive 钩子把 SSH
  // 公钥认证回调解析出的 git_keys.user_id 经 FLEETLY_PUSH_USER 环境变量
  // 原样透传；空 = 存量无主键/缺省（审计 actor 落 machine 原口径）。
  // 信任边界：钩子文件 daemon 属主 0600，与 hook token 同级——字段是
  // 审计归因面，不是授权面。
  string push_user = 4 [(buf.validate.field).string.max_len = 64];
}

// DeployFromGitResponse 与 DeployResponse 同投影面（独立消息以满足 buf
// lint 的 RPC 响应类型命名纪律；字段语义一致——入队即返回 queued）。
message DeployFromGitResponse {
  string deployment_id = 1;
  string app = 2;
  string status = 3;
  repeated ComposeWarning warnings = 4;
}

message DeployResponse {
  string deployment_id = 1;
  string app = 2;
  // 入队即返回，恒 "queued"。
  string status = 3;
  // compose 校验期非阻断标注（服务端受控子集校验的警告随响应带出——
  // T2.18：CLI 改经 RPC 入队后仍保留校验警告的人读呈现）。
  repeated ComposeWarning warnings = 4;
}

message CancelDeploymentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message CancelDeploymentResponse {
  string id = 1;
  // 置位 cancel_requested 时的状态（取消是异步语义：引擎先归位再落
  // cancelled；曾健康 409）。
  string status = 2;
}

message RollbackDeploymentRequest {
  string app = 1 [(buf.validate.field).string.min_len = 1];
  // 回滚目标版本快照 ID；空 = 最近一次成功部署的版本（回退一版）。
  string target_revision_id = 2;
}

message RollbackDeploymentResponse {
  string deployment_id = 1;
  string app = 2;
  // 恒 "queued"（入队即返回）。
  string status = 3;
}
