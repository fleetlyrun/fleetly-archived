# fleetlyd 配置示例。复制为 config.yaml 后按需修改；
# 启动：fleetlyd -c config.yaml（也可用 --addr 覆盖监听地址，显式
# flag 优先于本文件）。

# HTTP 面监听地址（REST/gateway + 框架 healthz 端点）；默认只绑回环。
addr: "127.0.0.1:8420"

# gRPC 面监听地址（CLI/SDK 直连；gateway 经本进程转发到它）；默认只绑回环。
grpc:
  addr: "127.0.0.1:8421"

# 控制面 TLS（V2-8，web 终端专项设计 §3.1）：8420（REST/gateway + /ui +
# healthz）与 8421（gRPC）双面同证书 TLS 化。off（缺省）= 今日明文行为
# 逐字不变（单节点 localhost 形态不受影响）。不做 mTLS/客户端证书——
# Bearer token 仍是唯一认证。
control_plane:
  tls:
    # TLS 模式：
    #   off      明文（缺省/留空）。
    #   platform 复用平台证书（_fleetly-platform 多 SAN 单证书：ctrl/
    #            registry/console.<base>；LE 签发与续期由平台证书 duty 承
    #            接）。要求 base_domain 非空（否则启动报错）。证书续期落
    #            盘后热重载（约 60s 内生效，新连接用新证书）。证书就绪前
    #            TLS 面照常监听、握手失败（等待签发的诚实形态，日志有
    #            warn/ready 锚点）。
    #   manual   显式证书对（cert_file/key_file；启动即校验可读，缺失报
    #            错）。证书更换需重启生效。
    mode: off
    # manual 模式的证书链 PEM 与私钥 PEM 路径（platform 模式忽略）。
    cert_file: ""
    key_file: ""
    # 最低 TLS 协议版本：tls1.2（缺省）| tls1.3。
    min_version: tls1.2

# TLS on 后的访问口径（CLI/SDK/Console）：
#   CLI/SDK —— --tls（校验证书，ServerName = 所拨主机名）/ --tls-insecure
#   （显式跳过校验）或 env FLEETLY_TLS=true|insecure；两旗标互斥。
#   Console —— 经 https://<SAN 主机>:8420 访问（platform 模式即
#   https://console.<base>:8420，需 DNS A 记录指到 manager）。IP 直连会有
#   证书名不匹配（浏览器例外，或换用 SAN 主机名）。

# Web 终端（E7，W5-S6）：AppDetail 的终端面板（fleetly-exec 执行中继 + PTY
# + xterm）。静态配置项——改动需重启。
terminal:
  # 是否启用 Web 终端（缺省 true）。安全基线 = terminal 独立 scope（默认仅
  # admin；`fleetly tokens create --scopes terminal` 可独立授予）+ 并发限额
  # （per-token 2 / 全局 8）+ 会话时限（空闲 10min / 硬上限 30min）。
  # false = duty 移除 fleetly-exec 服务、ticket 受理报 E_TERMINAL_DISABLED；
  # 集群 token secret 保留（重启用同一 token 身份；运维轮换路径见
  # docs/runbooks/web-terminal.md）。
  enabled: true

# 状态层（SQLite 权威态 + 底座观测缓存）。
state:
  # 状态库文件路径（启动即建库并应用迁移）。
  db_path: "./fleetly.db"
  # 事件保留天数（默认 30；非正值回落默认，不允许关闭清理）。
  event_retention_days: 30
  # 审计保留天数（默认 90——D-W0-6）。运行期可在 platform_settings 键
  # audit.retention_days 显式设置（优先级：platform_settings > 本键 > 90，
  # janitor 每拍现读）。
  audit_retention_days: 90
  # builds 终态行保留天数（S18-A10；默认 90。janitor 按 finished_at 清理
  # 终态构建台账行，非正值回落默认）。
  build_retention_days: 90
  # 底座（Docker Engine）连接地址；留空 = DOCKER_HOST 环境变量，再缺省
  # 本机套接字（linux unix socket / Windows named pipe）。
  docker_host: ""

# 认证面（v0.3 W2-S4 会话 TTL 收口；注册开关不走本文件——运行期经
# platform_settings auth.registration，PUT /v1/auth/registration）。
auth:
  # 会话滑动窗口时长（小时；缺省/非正值 = 168 即 7 天滑动。绝对寿命上限
  # 30 天是硬封顶——本项只能调短生效，配置超过上限时封顶到上限）。
  session_ttl_hours: 168

# 平台密钥（envelope 加密主密钥，architecture §2.3）：主密钥文件与备份数据
# 分离保存；权限过宽（POSIX group/other 可读）拒绝启动。
secrets:
  # 主密钥文件路径；留空 = ./fleetly.key。首次启动不存在时自动生成并
  # 日志提示妥善保存（丢失后平台 env 密文不可解）。
  key_path: "./fleetly.key"

# 构建管线（T2.8：Railpack + BuildKit，Dockerfile 兜底）。缺省形态 = 平台
# 自管 buildkitd 容器（钉版 moby/buildkit:v0.32.2，privileged + cgroup
# 限额 + 双缓存持久化），经 docker CLI 连接（docker-container://）。
build:
  # buildkit 端点；留空 = docker-container://fleetly-buildkit。指向外部
  # buildkitd（如 tcp://buildkit.internal:1234）时请把 manage_daemon 置
  # false（隔离升级形态：外部 buildkitd 自行运维）。
  buildkit_host: ""
  # 平台是否自管 buildkitd 容器（缺省 true）。
  manage_daemon: true
  # 自管 buildkitd 容器名（缺省 fleetly-buildkit）。
  daemon_container_name: "fleetly-buildkit"
  # 缓存持久化（两层，缺省全开）：
  #   cache_volume —— buildkitd 内部工作缓存命名卷（挂 /var/lib/buildkit，
  #                   容器重建不丢层缓存）；
  #   cache_dir    —— local cache 导入/导出的宿主目录（fleetlyd 侧数据根，
  #                   跨容器重建/跨实例可移植）。
  cache_volume: "fleetly-buildkit-cache"
  cache_dir: "./build-cache"
  # 构建产物归档根目录（railpack plan JSON / 构建日志，按 app/构建ID 落盘）。
  artifacts_dir: "./build-artifacts"
  # 产物归档目录保留天数（S18-A10；默认 30。janitor 按 mtime 清理，非正值
  # 回落默认）。
  artifacts_retention_days: 30
  # 构建队列并发上限（缺省 2，天花板 8；架构 §4.2 容量边界）。
  concurrency: 2
  # buildkitd 容器资源限额（Spike A E4 实证缺省：1GiB / 1.5 CPU 下真实
  # 构建可完成且不击穿宿主）。
  memory_bytes: 1073741824
  cpus: 1.5
  # 构建队列扫描周期（秒）。
  poll_seconds: 2
  # 单条构建执行超时预算（秒；缺省 1800 = 30min）。覆盖 buildkitd 就绪
  # 收敛 + solve + inspect 全程；超时 → 构建终态 failed（E_BUILD_FAILED），
  # 挂起构建不永久占用并发槽。daemon 重启/关停时在途构建复位为 failed
  # （构建不自动重跑，请重新触发部署）。
  timeout_seconds: 1800
  # 构建上下文受管根的额外根列表（H14 宿主目录信任边界）。构建上下文
  # （compose build.context 解析产物）必须位于受管根内，越界构建终态
  # failed（E_BUILD_FAILED，信息注明上下文目录越界）。缺省集合 = 系统
  # temp 根（恒在）+ git 裸仓库根；单机同宿主形态下 CLI 构建目录在此
  # 显式扩根接入（触发面已收敛为 admin scope token）。
  context_roots: []
  # 上传构建的上下文 tar 字节上限（MiB；IMPL-T2-2，缺省 256）。upload
  # 构建（`fleetly builds upload`/BuildFromUpload）在流式上传中累计，超限
  # fail-closed 拒绝（E_BUILD_UPLOAD_TOO_LARGE），不落盘不建行。
  max_upload_mb: 256

# 发布引擎（T2-5a：发布状态机/对账/窗口语义）。治理参数 v0.1 为平台默认
# （文件缺省即文档默认；release-semantics §2.8）——这些键是部署面覆盖入口，
# 不构成 per-app 可配置承诺。
engine:
  # L2 发布看门狗秒数（deploy_timeout_seconds；缺省 300，含 PENDING/停滞，
  # 有效值 ≥ health 预算；blocked_waiting 期间暂停计时）。
  deploy_timeout_seconds: 300
  # L3 观察窗秒数（observe_seconds；缺省 60，默认只告警）。
  observe_seconds: 60
  # 观察窗副本水位不足判定的持续秒数（replicas_below_seconds；缺省 10）。
  replicas_below_seconds: 10
  # 引擎轮询周期秒数（poll_seconds；缺省 2）。
  poll_seconds: 2
  # 运行域漂移检测扫描周期秒数（drift_interval_seconds；缺省 30——漂移检测
  # 扫描节拍，外部篡改受管字段的发现延迟上界；非正值回落默认）。
  drift_interval_seconds: 30

# 入口与证书（T2.15/T2.16：平台自管 Traefik + 配置端点 + 集中 ACME）。
# 缺省值经 internal/ingress 归一回落（traefik:v3.5 钉版、host 80/443、
# LE production、续期窗口 30 天）；下列键为部署面覆盖入口。
ingress:
  # 入口镜像（钉版；Spike B 实测版本。升级 = 改此项 + 回归，不追 latest）。
  traefik_image: "traefik:v3.5"
  # 宿主发布端口（host 模式）。
  http_port: 80
  https_port: 443
  # 控制面配置端点（Traefik HTTP provider 的拉取目标；独立内部端口，
  # 不与 REST/gateway 面混挂）。鉴权 token 强制（首启生成至 token_file）。
  config_addr: "0.0.0.0:8422"
  # 配置端点 TLS 面（E1 多节点设计 §2.4）：8423 上是全量动态配置 + 内联
  # 证书的 HTTPS 面（平台证书 SAN 含 ctrl.<base>），各节点 Traefik 的
  # provider endpoint 直连目标。仅 base_domain 非空时启用（单节点 v0.1
  # 形态维持明文 8422，行为逐字不变）；缺省值只是配置面就绪。
  config_tls_addr: "0.0.0.0:8423"
  # 下发给 Traefik 的控制面可达 IP；留空 = 自动探测（Swarm advertise
  # addr 优先，出口本地地址兜底）。Docker Desktop 形态 advertise addr 是
  # VM 内部 IP——须显式配置为宿主可达地址（如宿主局域网 IP）。
  config_advertise_ip: ""
  # 配置端点 bearer token 文件（首启生成，0600；与 Traefik 静态配置
  # providers.http.headers 同步传递）。
  token_file: "./fleetly-ingress.token"
  # 证书存储根目录（控制面侧明文 PEM：0600 私钥；独立备份目录
  # ——state-model §2.1。bind 挂载进 Traefik 只读 /fleetly-certs）。
  cert_dir: "./fleetly-certs"
  # 证书续期窗口天数（到期前）与扫描周期秒数。
  renew_before_days: 30
  renew_scan_seconds: 43200
  acme:
    # 集中签发开关（false = 只发布 HTTP 路由——无域名/离线环境的显式
    # 关闭位）。
    enabled: true
    # ACME 目录端点（默认 LE production；本地验证用 Pebble：
    # https://127.0.0.1:14000/dir）。
    ca_dir_url: "https://acme-v02.api.letsencrypt.org/directory"
    # ACME 账号邮箱。
    email: ""
    # CA 根证书池 PEM（Pebble/私有 CA 信任；空 = 系统信任池）。
    ca_pool_file: ""
    # ACME 账号私钥文件（空 = <cert_dir>/acme-account.key）。
    account_key_file: ""

# 多节点（E1，v0.2 W2）：平台域名 + 节点加入 + 平台 registry（键位口径见
# docs/design/2026-09-20-multi-node.md §2.2/§2.3/§2.5）。全部键缺省 =
# 单节点 v0.1 形态，行为逐字不变。

# 平台域名（V2-7 可选安装项；多节点 join 启用时必填——D-MN-13）。填写后
# 控制面派生三平台子域 ctrl/registry/console.<base>（A 记录矩阵见设计
# §2.2：ctrl 仅指 manager、registry/console 全部节点），并启用 8423 配置
# 端点 TLS 面。空 = 单节点（明文 8422 provider、本地 digest，逐字 v0.1）。
base_domain: ""

# 节点加入（设计 §2.3；D-MN-1）：worker join-token 轮换策略。
join:
  # auto = 节点锚定完成后自动 rotate（缺省——泄露窗口收敛到分钟级）；
  # manual = 批量加节点场景显式 opt-out，全部完成后手动
  # `fleetly nodes rotate-token`。
  token_rotate: auto

# 平台 registry（zot，设计 §2.5）：Swarm service 钉 manager + 本地命名卷
# fleetly-registry-data + overlay fleetly-system + Basic Auth；服务名/
# 卷名/网络名是平台常量，不走配置。
registry:
  # zot 镜像引用（钉版形态 name:tag@sha256:…）。空 = 部署器缺省（E1-4
  # 票据落定钉版，并接入 deploy/check-image-pins.sh 与镜像台账）。
  image: ""
  # registry Basic Auth 凭据文件路径。空 = <数据根>/fleetly-registry.auth
  # （平台生成随机 user/pass，0600，与 ingress token 同形、不入 SQLite；
  # 轮换 = 重新生成 + zot 配置更新 + 服务重建）。
  auth_file: ""

# 应用日志管线（T2.20：采集轮询 + 内存 ring 回放 + 落盘保留）。缺省值经
# internal/logs 归一回落（fleetly-logs 目录 / 保留 7 天 / 轮询 2s / ring
# 1000）；下列键为部署面覆盖入口。
logs:
  # 落盘根目录（logs.dir；缺省 ./fleetly-logs）。
  dir: "./fleetly-logs"
  # 落盘保留天数（logs.retention_days；缺省 7——应用日志 7 天轮转）。
  retention_days: 7
  # 采集轮询周期毫秒数（logs.scan_interval_millis；缺省 2000）。
  scan_interval_millis: 2000
  # per app-service 内存环形缓冲深度（logs.ring_size；缺省 1000——Follow
  # 接入时的回放上限）。
  ring_size: 1000

# 托管 metrics 栈（E6 W5-S3；D-W5-2 opt-in）。metrics.mode 是运行期设置
#（`fleetly metrics mode set <unset|on>` / Console metrics 卡），不在本
# 配置节——缺省 unset（零新增常驻），显式 on 后 duty 部署三件套
#（VictoriaMetrics 单机版 + cAdvisor + node_exporter，全部回环监听）。
metrics:
  # VictoriaMetrics 数据保留天数（metrics.retention_days；缺省 14——
  # 对齐 -retentionPeriod；非正值回落缺省）。
  retention_days: 14

# git push(SSH) 触发入口（T2.19）。宿主 git 为前置条件；bare 仓库按 app
# 懒创建（<root>/<app>.git），post-receive 钩子回调控制面入队部署。
git:
  # SSH git 面开关（缺省 true）。
  enabled: true
  # SSH 监听地址。安全默认基线：只绑回环（内部服务默认不暴露公网）——
  # VPS 上对外提供 git push 时改为 0.0.0.0:8424（或宿主 IP）并配合防火墙。
  addr: "127.0.0.1:8424"
  # git remote 提示的对外 host:port（可空）。Console「Deploy triggers」卡
  # 展示的 push 地址用它；解析链 = 本键显式配置 > base_domain 域名 > 监听
  # 地址主机位（通配/回环形态）。域名化部署留空即可（自动用 base_domain）；
  # git SSH 走独立主机名/端口时显式配置，如 "git.example.com:8424"。
  public_endpoint: ""
  # bare 仓库根目录；留空 = <state 库同目录>/git。
  root: ""
  # SSH host key 文件（ed25519 首启自动生成并持久化，指纹见启动日志；
  # 私钥绝不打印）；留空 = <root>/host_ed25519。
  host_key_file: ""

# webhook 触发入口（T2.19）：POST /v1/apps/<app>/webhooks/github|gitea。
# per-app secret 经 `fleetly apps webhook set-secret` 配置（未配置即未启用）；
# 验签 = HMAC-SHA256 对原始 body；防重放 = delivery ID TTL 缓存。
webhook:
  # delivery ID 防重放窗口秒数（缺省 900 = 15 分钟）。
  replay_ttl_seconds: 900

# Console 端静态托管（T2.21）：gateway 在 /ui/ 前缀托管 Console SPA 构建
# 产物（未命中文件的路径回退 index.html——SPA 深链）。静态资源不要求
# token；数据面恒走 REST /v1（全部 Bearer 鉴权，不因托管放宽）。
console:
  # SPA 构建产物目录（console/ 下 `pnpm install && pnpm build` 产出
  # console/dist）。空 = 镜像内置目录存在时启用（fleetlyd 容器形态把产物
  # 烤在 /opt/fleetly/console——2026-09-29 起 console 进镜像，开箱即有
  # /ui/；原生形态不安装该目录，缺省关闭口径不变）。显式配置示例：
  # static_dir: "./console/dist"
  static_dir: ""

# 平台状态备份（T2.22，备份基线与信任闭环）：SQLite 一致性快照
# （VACUUM INTO）→ 回读校验（integrity_check + 关键表行数）→ sha256 落
# manifest → state_backups 台账。触发 = 每次部署成功后（异步）+ 每日 +
# 手动（fleetly backups create / 升级前 pre_upgrade 快照）。
backup:
  # 备份根目录；留空 = <state 库同目录>/backups。布局 <dir>/<ULID>/ 下
  # fleetly.db + manifest.json（含 sha256/schema 版本/密钥指纹）。
  # **主密钥（fleetly.key）绝不进备份目录**——manifest 只记密钥文件的
  # sha256 指纹（恢复时 sha256sum 人工核对）；密钥另行离线保管，
  # 见 docs/runbooks/backup-restore.md。把 key_path 配进备份目录会被
  # 构造期拒绝（fail-fast）。
  dir: ""
  # 保留份数（缺省 7；超限删最旧——台账删行 + 审计 backup.pruned +
  # 目录清除，台账只描述真实存在的备份）。
  keep: 7

# 日志级别（lynx 约定键）：debug | info | warn | error
logging:
  level: info
