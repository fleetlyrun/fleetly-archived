name: ord1
# Spike ④ 场景 1：base→mid→leaf 依赖链（无 depends_on——现行口径拒收）。
# mid/leaf 在依赖未就绪时 exit 1（swarm 默认 restart=any 自愈），用于观测
# 「并行创建 + 自愈窗口」的真实行为与 crash-loop 噪音。
services:
  base:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    command:
      - sh
      - -c
      - "sleep 8; touch /tmp/ready; while true; do nc -l -p 8080 >/tmp/nc-base.log; done"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 1s
      timeout: 1s
      retries: 100
      start_period: 0s
  mid:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    command:
      - sh
      - -c
      - "nc -w 2 base 8080 </dev/null || exit 1; touch /tmp/ready; while true; do nc -l -p 8080 >/tmp/nc-mid.log; done"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 1s
      timeout: 1s
      retries: 100
      start_period: 0s
  leaf:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    command:
      - sh
      - -c
      - "nc -w 2 mid 8080 </dev/null || exit 1; touch /tmp/ready; sleep 600"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 1s
      timeout: 1s
      retries: 100
      start_period: 0s
